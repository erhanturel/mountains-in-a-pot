<title>Uplift</title>
<style>

    border-bottom:1px solid #12161c;border-left:2px solid transparent;

<div class="wrap">
  <h1>Uplift</h1>
  <div class="main">
    <div>
      <div id="board"><div id="info"></div></div>
      <div class="hint"><b>click a hex</b> — drag to orbit, scroll to zoom.
        Soil gathers below high ground on its own; Seed greens any patch that
        has soil, water within reach, and no lava.</div>
    </div>
    <div>
      <div class="menu">
        <h2>Powers</h2>
        <div id="powers"></div>
      </div>
      <div class="menu" style="margin-top:14px">
        <h2>View</h2>
        <button class="pw" id="ovProj"><svg viewBox="0 0 18 18">
          <path d="M9 1.5 16 5.5v7L9 16.5 2 12.5v-7z"/><path d="M9 8.5 16 5.5"/>
          <path d="M9 8.5 2 5.5"/><path d="M9 8.5v8"/></svg>
          <span>Flat view</span></button>
        <button class="pw" id="ovMoist"><svg viewBox="0 0 18 18">
          <path d="M9 2.2c3.1 3.6 4.7 5.9 4.7 7.9a4.7 4.7 0 0 1-9.4 0c0-2 1.6-4.3 4.7-7.9z"/>
          </svg><span>Moisture</span></button>

    </div>
  </div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/addons/controls/OrbitControls.js';

/*==CORE-START==*/
/* ======================================================================
   An island of hexes. Four powers. Two liquids that behave the same way.

   STORED per hex:  h    ground height
                    vol  is this ground VOLCANIC ROCK
                    src  what stands here — nothing, water, or lava. Both
                         liquids are ENDLESS SOURCES once they exist.

   DERIVED, rebuilt from scratch after every click:
                    liq    what is actually standing here
                    ls     the surface it stands at
                    moist  how many neighbours are water   (the sea counts)
                    temp   how many neighbours are lava
                    Both auras are plain counts. Neither accumulates and
                    neither can ever turn into the liquid it came from.

   THE RULES
     A hex is a BASIN if a liquid put on it could not get away — if it must
     rise above its own ground to escape. Off the rim is the VOID — the
     board is a disc floating in space, and anything reaching an edge falls
     off it.
     DELUGE fills the connected basin you click with water, to the brim —
     and basins NEST, so the water rises only to the first rim it meets.
     LAVA fills that same basin with lava instead. Off a basin, neither does
     anything: it runs away.
     Lava that TOUCHES WATER — a lake, or water poured onto it —
     sets on the spot into VOLCANIC ROCK, level with the basin's brim. That
     is the only way volcanic rock is ever made, and the only thing that
     ever removes lava.
   ====================================================================== */
/* THE EDGE IS THE VOID. There was a sea here once, then a wall standing at
   5 that replaced it. The wall stood ABOVE the floor, which made the whole
   board one basin — one Deluge drowned all 127 hexes, any hollow dug near a
   hill flooded to the brim, and rivers had nowhere on earth to drain, so the
   priority flood had to be seeded from the lowest cell to mean anything.

   Now the board is a disc in open space. Anything that reaches an edge goes
   over it. That gives the outlet back and deletes that whole class of
   problem at once. */
const R=6, H_MAX=12;
const NONE=0, WATER=1, LAVA=2;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];   /* E NE NW W SW SE */

const T=[], idx=new Map();
for(let q=-R;q<=R;q++){
  const lo=Math.max(-R,-q-R), hi=Math.min(R,-q+R);
  for(let r=lo;r<=hi;r++){
    idx.set(q+','+r,T.length);
    T.push({q,r,x:Math.sqrt(3)*(q+r/2),y:1.5*r,
            src:NONE,seed:false,
            liq:NONE,ls:0,moist:0,temp:0,rel:0,soil:0,life:false});
  }
}

/* ---------------------------------------------------------------------
   THE STACK.

   A column is no longer one number. It is a run of CELLS, one per level,
   each of them air or rock or basalt. `h` and `vol` are now ACCESSORS over
   that stack: every rule that read a height still reads a height, every rule
   that wrote one still writes one, and none of them know anything changed.
   The encoding moved; the interface did not.

   That is the whole of this step, deliberately. Caves and overhangs are
   impossible with one height per column — but they are also impossible to
   check against what came before, so the storage changes here and NOTHING
   else, verified by running the same boards through both and diffing.

   Cell z occupies the slab from height Z0+z to Z0+z+1, so a column whose
   highest solid cell is z has its surface at Z0+z+1. TOP caches that
   highest cell: h is read constantly, in every inner loop of soils() and
   fillFrom(), and rescanning 32 cells each time was not affordable.
   --------------------------------------------------------------------- */
const ZN=32, Z0=-13;
const AIR=0, ROCK=1, BASALT=2;
const CELL=new Uint8Array(T.length*ZN);
const TOP=new Int8Array(T.length).fill(-1);
const cell=(i,z)=>(z<0||z>=ZN)?AIR:CELL[i*ZN+z];
/* after any direct edit to the cells, the cached surface has to be found again */
function retop(i){
  const b=i*ZN;
  let z=ZN-1;
  while(z>=0 && !CELL[b+z]) z--;
  TOP[i]=z;
  return z;
}
/* fill a column solid up to this surface height, keeping the material it
   already had and clearing everything above */
function setTop(i,h){
  const b=i*ZN, t=Math.max(-1,Math.min(ZN-1,h-Z0-1));
  const m=(TOP[i]>=0 && CELL[b+TOP[i]]) || ROCK;
  for(let z=0;z<ZN;z++) CELL[b+z] = z<=t ? (CELL[b+z]||m) : AIR;
  TOP[i]=t;
}
for(let i=0;i<T.length;i++){
  Object.defineProperty(T[i],'h',{
    get(){ return Z0+TOP[i]+1; },
    set(v){ setTop(i,v); },
    enumerable:true});
  Object.defineProperty(T[i],'vol',{
    get(){ return TOP[i]>=0 && CELL[i*ZN+TOP[i]]===BASALT; },
    /* per-hex today, so setting it converts the whole column — the same
       information the old boolean carried, held one level down */
    set(v){ const b=i*ZN, m=v?BASALT:ROCK;
      for(let z=0;z<ZN;z++) if(CELL[b+z]) CELL[b+z]=m; },
    enumerable:true});
  setTop(i,0);
}
for(const t of T) t.nb=DIRS.map(d=>{
  const j=idx.get((t.q+d[0])+','+(t.r+d[1])); return j===undefined?-1:j});
/* the ring at distance TWO — moisture reaches further than one hex now */
const RING2=[];
for(let dq=-2;dq<=2;dq++) for(let dr=-2;dr<=2;dr++)
  if((Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2===2) RING2.push([dq,dr]);
for(const t of T) t.nb2=RING2.map(d=>{
  const j=idx.get((t.q+d[0])+','+(t.r+d[1])); return j===undefined?-1:j});
for(const t of T) t.coast=t.nb.filter(j=>j<0).length;
const at=(q,r)=>{const i=idx.get(q+','+r);return i===undefined?-1:i};
const surf = t => t.liq!==NONE ? t.ls : t.h;

/* ---------------------------------------------------------------------
   FILL — pour a liquid in at these hexes and let it rise until it finds a
   way out. Returns what ends up submerged, and the level it stands at.

   The water rises to the FIRST rim it meets, not to the ultimate way out to
   the sea. That is what makes basins NEST: a hex at -2 in the middle of a
   -1 plateau fills on its own, to -1, while clicking the plateau itself
   fills the whole plateau to 0. You choose the scale by where you click.
   --------------------------------------------------------------------- */
function fillFrom(seeds){
  const inS=new Set(seeds);
  /* the HIGHEST seed, not the lowest: adjacent wet hexes are one pool, and
     the water has to stand above all of them. Taking the lowest left a
     shallow seed with its own surface below its own bed. */
  let level=-Infinity;
  for(const s of seeds) level=Math.max(level,T[s].h);
  const hOf = x => x<0 ? -Infinity : T[x].h;    /* off the rim is nothing at all */
  const fr=[];
  const spread=i=>{ for(const j of T[i].nb) if(j<0||!inS.has(j)) fr.push(j); };
  for(const s of seeds) spread(s);
  while(fr.length){
    let b=0;
    for(let k=1;k<fr.length;k++) if(hOf(fr[k])<hOf(fr[b])) b=k;
    const f=fr.splice(b,1)[0];
    if(f>=0 && inS.has(f)) continue;
    /* the lowest thing around us stands higher: that is the rim, and the
       liquid rests against it */
    if(hOf(f)>level) return {cells:[...inS], level:hOf(f), open:false};
    /* it reached an edge: over it goes, and it is gone */
    if(f<0) return {cells:[...inS], level:0, open:true};
    inS.add(f); spread(f);
  }
  return {cells:[...inS], level, open:true};
}
/* the basin under a hex, or null if a liquid put there would run away.
   Deluge and Lava both read this same answer. */
function basinAt(i){
  if(i<0) return null;
  const f=fillFrom([i]);
  return (f.open || f.level<=T[i].h) ? null : f;
}

function flood(){
  /* Setting lava raises the ground, which can put a new basin in reach of a
     new liquid, so this repeats until the board stops changing. Solidifying
     only ever raises ground, so it always terminates. */
  for(let guard=0; guard<24; guard++){
    for(const t of T){ t.liq=NONE; t.ls=t.h; }

    /* Adjacent sources are one body — and so are sources that do NOT touch
       but end up in the same pool. A source can sit inside a basin filled
       from somewhere else, and fillFrom will submerge it without ever
       knowing it was there. Group by touching first, then merge any two
       groups whose fills overlap and fill again, until none overlap.

       Without the merge the two bodies both wrote their own level over the
       shared hex and the last one won, leaving that hex holding water at a
       level its own neighbours did not share. It corrected itself on the
       next click — once the pool had written src across all its cells the
       groups touched and merged — so the board was quietly one click stale.
       Each merge removes a group, so this always terminates. */
    const seen=new Array(T.length).fill(false), groups=[];
    for(let i=0;i<T.length;i++){
      if(seen[i]||T[i].src===NONE) continue;
      const grp=[i], q=[i]; seen[i]=true;
      while(q.length){
        const k=q.pop();
        for(const j of T[k].nb){
          if(j<0||seen[j]||T[j].src===NONE) continue;
          seen[j]=true; grp.push(j); q.push(j);
        }
      }
      groups.push(grp);
    }
    let bodies=[];
    for(;;){
      bodies=groups.map(grp=>Object.assign({grp},fillFrom(grp)));
      let a=-1,b=-1;
      const owner=new Map();
      for(let n=0;n<bodies.length && b<0;n++)
        for(const c of bodies[n].cells){
          if(!owner.has(c)){ owner.set(c,n); continue; }
          a=owner.get(c); b=n; break;
        }
      if(b<0) break;
      groups[a]=groups[a].concat(groups[b]);
      groups.splice(b,1);
    }
    for(const bd of bodies){
      bd.wat=bd.grp.some(i=>T[i].src===WATER);
      bd.lav=bd.grp.some(i=>T[i].src===LAVA);
    }
    for(const b of bodies){
      if(b.open){ for(const i of b.cells) T[i].src=NONE; continue; }  /* it ran away */
      const kind=b.wat?WATER:LAVA;
      for(const i of b.cells){ T[i].liq=kind; T[i].ls=b.level; T[i].src=kind; }
    }
    /* lava meeting water sets into volcanic rock, level with the brim.
       With no sea there is only one route left: rain into a lava pool. */
    let set=false;
    for(const b of bodies){
      if(!b.lav||b.open) continue;
      const quenched = b.wat || b.cells.some(i =>
        T[i].nb.some(j=>j>=0 && T[j].liq===WATER));
      if(!quenched) continue;
      for(const i of b.cells){
        T[i].h=b.level; T[i].vol=true; T[i].src=NONE; T[i].liq=NONE;
      }
      set=true;
    }
    if(set) continue;                        /* the ground moved — solve again */
    for(let i=0;i<T.length;i++) if(T[i].src!==NONE && T[i].liq===NONE) T[i].src=NONE;
    break;
  }
  /* the two auras: plain counts of what is next to you */
  for(const t of T){
    let m=0, tp=0;
    /* MOISTURE reaches two hexes: two points for water alongside, one for
       water a hex further off. The wall is rock and gives nothing, so all of
       it comes from water the player actually put on the board. Still a plain
       count — it accumulates nothing and can never turn into water itself. */
    if(t.liq===NONE){
      for(const j of t.nb)  if(j>=0 && T[j].liq===WATER) m+=2;
      for(const j of t.nb2) if(j>=0 && T[j].liq===WATER) m+=1;
    }
    if(t.liq!==LAVA) for(const j of t.nb) if(j>=0 && T[j].liq===LAVA) tp++;
    t.moist=m; t.temp=tp;
  }
  soils();
  lives();
  rains();          /* a leaf: it reads settled ground and water, and nothing reads it */
}

/* ---------------------------------------------------------------------
   SOIL is not placed. It is what the shape of the land does with itself.

   For each hex, d is the drop to each lower neighbour and D the sum of all
   six. D measures how EXPOSED a hex is, so the middle of a plateau does not
   weather at all and only its edges do.

     WEATHERING  a hex breaks rock down at  D x (1 + moisture)  — water is
                 what does the work, so sea cliffs and lake shores go
                 fastest — doubled on basalt, and nil where life has bound
                 the ground with roots.
     TRANSPORT   it hands that load to each lower neighbour in proportion to
                 that neighbour's own drop, so sediment follows the steepest
                 way down. Of what it RECEIVES it keeps 1/(1+D): flat ground
                 keeps everything it is handed, steep ground keeps almost
                 none. Freshly weathered rock always moves on, which is what
                 keeps high ground bare.

   Carried as a real number and only bucketed to 0-5 at the end. Splitting
   it into whole units meant handing out a remainder, and the remainder
   always went the same way round the ring — so a perfectly symmetric peak
   grew a lopsided apron, always to the east. Determinism is the point;
   a fixed direction winning is not.
   --------------------------------------------------------------------- */
/* Off the rim counts as ground at 0 for sediment. Putting it any lower made
   every edge hex read as sloped, so it carried everything straight over the
   side and an edge plain could never hold soil. */
const BED=0, RATE=0.35, SOIL_MAX=5;
function soils(){
  const n=T.length, load=new Array(n).fill(0), fall=[];
  for(let i=0;i<n;i++){
    const d=[]; let D=0;
    for(let k=0;k<6;k++){
      const j=T[i].nb[k], hh = j<0 ? BED : T[j].h;
      const dd=Math.max(0, T[i].h-hh);
      d.push(dd); D+=dd;
    }
    fall.push(d); T[i].rel=D;
  }
  /* high ground first: a hex can only be fed from strictly above it, so by
     the time it is reached its load is complete. Hexes at equal height never
     exchange, so ties cannot change the answer. */
  const order=T.map((t,i)=>i).sort((a,b)=>T[b].h-T[a].h);
  for(const i of order){
    const t=T[i], d=fall[i], D=t.rel;
    if(t.life){ t.soil=Math.min(SOIL_MAX,load[i]); continue; }   /* roots hold it */
    const weather = D * (1+t.moist) * (t.vol?2:1) * RATE;
    if(D===0){ t.soil=Math.min(SOIL_MAX, load[i]+weather); continue; }  /* nowhere to go */
    const keep=load[i]/(1+D);
    t.soil=Math.min(SOIL_MAX, keep);
    const move=(load[i]-keep)+weather;
    for(let k=0;k<6;k++){
      if(d[k]<=0) continue;
      const j=T[i].nb[k];
      if(j>=0) load[j] += move*d[k]/D;      /* proportional — nothing left over */
    }
  }
}
/* ---------------------------------------------------------------------
   LIFE holds where there is soil to root in, water within reach, and no
   lava beside it. A seed greens its whole connected patch at once, and
   every living hex becomes a seed itself, so the patch remembers where it
   is. Change the ground and it re-solves — it can be cut in two, and it
   can die.
   --------------------------------------------------------------------- */
const habit = t => t.liq===NONE && t.soil>=1 && t.moist>=1 && t.temp===0;
/* Life BINDS the ground it stands on, and habitability needs soil to stand
   in, so the two define each other. Life owns that knot rather than leaving
   it to whoever calls: it re-solves the soil itself, and keeps doing it until
   life stops moving.

   One pass each was not enough. It left the board a click stale wherever a
   patch had just greened or just died, and even after re-solving the soil
   once, life was still being decided on the soil from half a step earlier.
   That was harmless while moisture only reached one hex and life was rare —
   zero cases in a thousand boards. Widening moisture to two hexes made life
   common enough to find it: one board in two hundred settled to a different
   patch when left alone. The seeds are taken ONCE at the top, because
   t.seed = t.life at the bottom would otherwise eat them between passes. */
function lives(){
  const seeds=T.map(t=>t.seed);
  let prev='';
  for(let pass=0; pass<8; pass++){
    for(const t of T) t.life=false;
    const q=[];
    for(let i=0;i<T.length;i++) if(seeds[i] && habit(T[i])){ T[i].life=true; q.push(i); }
    while(q.length){
      const i=q.pop();
      for(const j of T[i].nb)
        if(j>=0 && !T[j].life && habit(T[j])){ T[j].life=true; q.push(j); }
    }
    soils();                                  /* the soil life now binds */
    const now=T.map(t=>t.life?1:0).join('');
    if(now===prev) break;
    prev=now;
  }
  for(const t of T) t.seed = t.life;          /* it remembers itself, like water */
}
/* ---------------------------------------------------------------------
   RIVERS — where the rain goes.

   Rain is MOISTURE meeting HEIGHT, and both are read off the hex itself.

   A hex rains when it is damp enough — above MOIST_MIN — and it rains harder
   the higher it stands. That is orography in one line: moist air coming off
   the water, forced up over ground near it, and dropping what it carries.
   A pot with no water has no moisture anywhere and so no rivers anywhere,
   which falls out rather than being a rule.

   The point of it is that it is LOCAL. The rain used to be a global sum —
   total standing water anywhere on the board — so pouring a lake in one
   corner changed rivers in the other and nothing you could look at explained
   why. Now a hex's rain depends on that hex's own two readings, both of
   which are already on the panel.

   Each hex sheds its rain to its six corners in proportion to how far each
   corner sits below it, then the lattice routes it downhill by STEEPEST
   DESCENT: all of it to the lowest way out, split equally when several tie.
   Not shared out in proportion — that braids every river into a delta and
   nothing ever clears the threshold. And not broken by ring order either:
   that is precisely how a symmetric peak grew a lopsided apron, always to
   the east, back when soil handed out a remainder. A tie is a real saddle
   and a real saddle really does fork.

   Level ground is gathered into REGIONS of equal height and each region
   routes as one. That is what carries a river across a lake: a lake is
   already brim-full by construction — fillFrom stops at the first rim it
   meets — so it is a flat region that spills at its lowest way out. Rivers
   pass through lakes rather than dying in them, and no volume is tracked
   anywhere. A hollow with no way out is a sink and the water stops there.
   --------------------------------------------------------------------- */
/* RAIN is the abundance knob, as RATE is for soil. MOIST_MIN is the damp a
   hex needs before it rains at all — moisture runs 0..24 now (two a side,
   one at a hex's remove, twelve hexes in that outer ring). FALL_MIN is in
   THIRDS, and because two nodes on a seam share two of their three hexes, a
   seam's drop in thirds is exactly the height difference between the hexes
   capping its ends — so 3 means a three-step cliff. Calibrated against a
   board somebody would actually build rather than against extremes, and none
   of it playtested hard. */
/* ---------------------------------------------------------------------
   RIVERS — where the rain goes, tile by tile.

   Rain is MOISTURE meeting HEIGHT, both read off the hex itself. A hex rains
   when it is damp enough — above MOIST_MIN — and harder the higher it stands.
   That is orography in one line: moist air off the water, forced up over
   ground near it, dropping what it carries. A pot with no water has no
   moisture and so no rivers, which falls out rather than being a rule.

   Water then runs downhill from tile to tile by STEEPEST DESCENT — all of it
   to the lowest way out, split equally when several tie. Not shared out in
   proportion like soil: that braids every river into a delta and nothing ever
   clears the threshold. And never broken by ring order, which is exactly how
   a symmetric peak once grew a lopsided apron, always east. A tie is a real
   saddle and a real saddle really does fork.

   It ACCUMULATES, which is the whole point and the thing a spreading rule
   cannot do. A hundred small flows gather into a dozen and then into one, so
   a river coming off a range is bigger than a river coming off a bump.

   THE SURFACE IT RUNS ON is the ground plus its soil mantle, h + soil x TILT.
   Whole heights leave long runs of exactly equal neighbours — a plateau, a
   valley floor — and between equals there is no downhill at all. Soil is a
   real number that varies across those runs, so it breaks the ties the ground
   cannot. TILT keeps the whole soil range under one height step, so soil can
   only ever settle a tie and never reorder real terrain.

   It is not a complete answer: weathering needs relief, so the middle of a
   plateau has no soil and no soil gradient either. Whatever stays exactly
   level is gathered into a REGION and routed as one, which also carries a
   river across a lake — a lake is brim-full by construction, so it spills at
   its lowest way out and the river comes out the far side.
   --------------------------------------------------------------------- */
const RAIN=0.2, MOIST_MIN=2, RIVER_MIN=1.0, FALL_MIN=2, TILT=0.1;
function rains(){
  const n=T.length;
  for(const t of T){ t.rain=0; t.flow=0; t.river=0; t.outs=[]; }
  let wet=0;
  for(const t of T) if(t.liq===WATER) wet++;
  if(!wet) return;                      /* a dry pot has no weather at all */

  /* top is the real surface — soil-mantled ground, or the lid of water lying
     over it. surf is what we ROUTE on, and gets raised where a pit is filled. */
  const top=new Array(n), surf=new Array(n);
  for(let i=0;i<n;i++){
    const t=T[i];
    top[i] = t.liq!==NONE ? t.ls : t.h + t.soil*TILT;
    surf[i]= top[i];
    if(t.liq===NONE) t.rain=RAIN*Math.max(0,t.moist-MOIST_MIN)*Math.max(0,t.h);
  }

  /* PRIORITY FLOOD, out from the lowest tile on the board. A tile's routing
     height becomes the lowest level at which it can still reach that outlet,
     so a real hollow is raised to its own brim and spills, exactly as
     fillFrom does, while everything already draining keeps its true height.
     It has to be seeded from the outlet: the pot is SEALED, so its lowest
     ground has no way out at all, and raising each sink to its lowest
     neighbour instead walked the whole floor up until it merged into the
     nearest lake — and a river arriving at a lake was then declared to have
     reached the bottom of the world, and died there. */
  const fill=new Array(n).fill(Infinity), heap=[];
  const push=(h,i)=>{ heap.push([h,i]); let k=heap.length-1;
    while(k>0){ const p=(k-1)>>1; if(heap[p][0]<=heap[k][0]) break;
      const t=heap[p]; heap[p]=heap[k]; heap[k]=t; k=p; } };
  const pop=()=>{ const t0=heap[0], last=heap.pop();
    if(heap.length){ heap[0]=last; let k=0;
      for(;;){ const l=2*k+1, r=l+1; let m=k;
        if(l<heap.length&&heap[l][0]<heap[m][0]) m=l;
        if(r<heap.length&&heap[r][0]<heap[m][0]) m=r;
        if(m===k) break; const t=heap[m]; heap[m]=heap[k]; heap[k]=t; k=m; } }
    return t0; };
  let low=0;
  for(let i=1;i<n;i++) if(top[i]<top[low]) low=i;
  fill[low]=top[low]; push(fill[low],low);
  while(heap.length){
    const [h,i]=pop();
    if(h>fill[i]) continue;
    for(const j of T[i].nb){
      if(j<0) continue;
      const nh=Math.max(top[j],h);
      if(nh<fill[j]){ fill[j]=nh; push(nh,j); }
    }
  }
  for(let i=0;i<n;i++) surf[i]=fill[i];

  /* gather what is left exactly level — flats, and every lake — into regions */
  const reg=new Array(n).fill(-1), regs=[];
  for(let i=0;i<n;i++){
    if(reg[i]>=0) continue;
    const g=regs.length, cells=[i], q=[i]; reg[i]=g;
    while(q.length){
      const k=q.pop();
      for(const j of T[k].nb)
        if(j>=0 && reg[j]<0 && surf[j]===surf[k]){ reg[j]=g; cells.push(j); q.push(j); }
    }
    regs.push({cells, h:surf[i]});
  }

  /* high to low: a region can only be fed from strictly above it, so by the
     time it is reached its total is complete. Equal regions never exchange,
     so ties in the ordering cannot change the answer. */
  const got=new Array(n);
  for(let i=0;i<n;i++) got[i]=T[i].rain;
  const order=regs.map((g,k)=>k).sort((a,b)=>regs[b].h-regs[a].h);
  for(const k of order){
    const g=regs[k];
    /* where it spills: the lowest ground just outside the region */
    let best=Infinity, spill=[];
    for(const i of g.cells) for(const j of T[i].nb){
      if(j<0 || reg[j]===k || surf[j]>=g.h) continue;
      if(surf[j]<best){ best=surf[j]; spill=[[i,j]]; }
      else if(surf[j]===best) spill.push([i,j]);
    }
    if(!spill.length) continue;         /* a sink — the water stops here */

    /* Walk the water ACROSS the flat to the nearest way off rather than
       letting it teleport there. Breadth-first in from the spill tiles gives
       every tile in the region a step to take, and the tiles it crosses show
       a channel instead of nothing. Without this a plateau was one region
       and all its rain left through a single tile: on a massif of twelve,
       three tiles carried water and nine carried none. */
    const depth=new Map(), q=[];
    for(const [i] of spill) if(!depth.has(i)){ depth.set(i,0); q.push(i); }
    for(let p=0;p<q.length;p++){
      const i=q[p];
      for(const j of T[i].nb)
        if(j>=0 && reg[j]===k && !depth.has(j)){ depth.set(j,depth.get(i)+1); q.push(j); }
    }
    /* furthest first, so each tile is complete before it hands on */
    for(const i of [...g.cells].sort((a,b)=>depth.get(b)-depth.get(a))){
      if(!(got[i]>0)) continue;
      const d=depth.get(i);
      const outs = d===0 ? spill.filter(e=>e[0]===i).map(e=>e[1])
                         : T[i].nb.filter(j=>j>=0 && reg[j]===k && depth.get(j)===d-1);
      if(!outs.length) continue;
      const share=got[i]/outs.length;
      for(const j of outs) got[j]+=share;
      T[i].flow=got[i]; T[i].outs=outs;
    }
  }
  for(const t of T) t.river = t.flow>=RIVER_MIN ? t.flow : 0;
}
const isFall = i => T[i].river>0 &&
  T[i].outs.some(j=>(T[i].h-T[j].h)>=FALL_MIN);

/* the patch a seed here would green — for the overlay */
function patchAt(i){
  if(i<0||!habit(T[i])) return null;
  const cells=[i], seen=new Set([i]), q=[i];
  while(q.length){
    const k=q.pop();
    for(const j of T[k].nb)
      if(j>=0 && !seen.has(j) && habit(T[j])){ seen.add(j); q.push(j); cells.push(j); }
  }
  return cells;
}

const legal=(i,p)=> p.d===0 ? true
                  : p.d>0 ? T[i].h<H_MAX : T[i].h>-H_MAX;
function use(i,p){
  if(i==null||i<0||!T[i]||!legal(i,p)) return false;
  if(p.k==='seed'){
    if(!habit(T[i])) return false;               /* nothing will take there */
    T[i].seed=true;
  } else if(p.d===0){
    if(!basinAt(i)) return false;                /* it just runs off */
    T[i].src = p.k==='lava' ? LAVA : WATER;
  } else T[i].h+=p.d;
  flood();
  return true;
}
/*==CORE-END==*/

/* ======================================================================
   THREE.JS RENDERER

   Everything above CORE-END is the simulation and knows nothing about this.
   That split is why the renderer could be swapped out from under it without
   touching a rule, and why `node test/rules.test.js` still runs with no
   server and no three.js at all — it reads the CORE block out of this file
   and evaluates it on its own.

   The board is drawn as ONE instanced mesh of hexagonal prisms: a unit prism
   scaled in Y per column. CylinderGeometry with six radial segments IS a hex
   prism, and its first vertex sits on +Z, which is pointy-top in the axial
   layout we already use — so nothing needs rotating to line it up.

   The camera replaces the whole hand-rolled view layer. The painter's sort,
   the per-face visibility test, the light fixed in screen space, the
   sixth-of-a-turn spin and the hand-written point-in-hex test are all gone,
   and orbit, zoom and true isometric come free.
   ====================================================================== */
const RISE=0.34;                 /* one height step, in hex radii */
const BASE=-H_MAX-1;             /* every column is solid rock down to here */

/* the powers menu — the five things a click can be */
const POWERS=[
  {k:'uplift', nm:'Uplift',  d:+1,
   ic:'<svg viewBox="0 0 18 18"><path d="M2 15h14"/><path d="M4.5 12 9 4l4.5 8z"/></svg>'},
  {k:'subduct',nm:'Subduct', d:-1,
   ic:'<svg viewBox="0 0 18 18"><path d="M2 3h14"/><path d="M4.5 6 9 14l4.5-8z"/></svg>'},
  {k:'deluge', nm:'Deluge',  d:0,
   ic:'<svg viewBox="0 0 18 18"><path d="M3 2.5 4.5 6"/><path d="M7.5 1.5 9 5"/>'+
      '<path d="M12 2.5 13.5 6"/><path d="M2.5 15.5h13"/>'+
      '<path d="M5.5 15.5c0-2.5 3.5-3 3.5-6 0 3 3.5 3.5 3.5 6z"/></svg>'},
  {k:'lava',   nm:'Lava',    d:0,
   ic:'<svg viewBox="0 0 18 18"><path d="M1.5 15.5h15"/>'+
      '<path d="M4 15.5 7.2 8h3.6l3.2 7.5z"/><path d="M7.2 8h3.6"/>'+
      '<path d="M7.6 5.5C7.6 4 6.6 3.4 7.6 1.8"/>'+
      '<path d="M10.4 5.5c.6-1.5 1.6-2.1 1-3.7"/></svg>'},
  {k:'seed',   nm:'Seed',    d:0,
   ic:'<svg viewBox="0 0 18 18"><path d="M9 16V8"/>'+
      '<path d="M9 8C9 4.5 11.5 2.5 15 2.5 15 6 12.5 8 9 8z"/>'+
      '<path d="M9 10C9 7.5 7 6 4 6c0 2.5 2 4 5 4z"/></svg>'}
];
let POWER=POWERS[0];

const board=document.getElementById('board');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
board.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070a);
scene.add(new THREE.AmbientLight(0xffffff,0.62));
const sun=new THREE.DirectionalLight(0xffffff,0.95);
sun.position.set(-8,16,10);
scene.add(sun);
const fillLight=new THREE.DirectionalLight(0x88aacc,0.25);
fillLight.position.set(9,6,-8);
scene.add(fillLight);

/* Orthographic reads as isometric, which is the look this board wants.
   Perspective is there for when you want to feel the depth. */
const SPAN=15;                   /* board radius plus margin, in hex radii */
let ortho=true, cam=null, controls=null;
function makeCam(){
  const w=board.clientWidth||900, h=board.clientHeight||660, a=w/h;
  const was=cam;
  cam = ortho ? new THREE.OrthographicCamera(-SPAN*a,SPAN*a,SPAN,-SPAN,0.1,300)
              : new THREE.PerspectiveCamera(38,a,0.1,300);
  cam.position.copy(was?was.position:new THREE.Vector3(0,24,28));
  if(controls){ controls.object=cam; controls.update(); }
  return cam;
}
cam=makeCam();
controls=new OrbitControls(cam,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minPolarAngle=0.15; controls.maxPolarAngle=Math.PI/2-0.05;
controls.update();

/* ---- the ground: one instance per board hex, then one per wall hex ---- */
const prism=new THREE.CylinderGeometry(1,1,1,6);
/* One prism per solid RUN, not per column. Every column is a single run
   today so this draws exactly what it drew before — but a carved column has
   several, and the count has to be able to grow. Worst case is alternating
   cells, so half a stack per column. */
const MAXRUN=T.length*Math.ceil(ZN/2);
const instHex=new Int16Array(MAXRUN).fill(-1);
const ground=new THREE.InstancedMesh(
  prism, new THREE.MeshLambertMaterial(), MAXRUN);
ground.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(ground);

/* liquids get their own meshes: water sees through, lava does not */
const water=new THREE.InstancedMesh(prism,
  new THREE.MeshLambertMaterial({color:0x3c86b4,transparent:true,opacity:0.72}),
  T.length);
const lava=new THREE.InstancedMesh(prism,
  new THREE.MeshLambertMaterial({color:0xd2551e,emissive:0x5a1c06}), T.length);
water.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
lava.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(water); scene.add(lava);

/* Hex boundaries. Level ground is one smooth plane without them and the grid
   simply is not visible — the flat renderer got this from a stroke per hex.
   All of them live in ONE LineSegments, so it stays a single draw call. */
const COS=[], SIN=[];
for(let k=0;k<6;k++){ const a=k/6*Math.PI*2; SIN.push(Math.sin(a)); COS.push(Math.cos(a)); }
const edgePos=new Float32Array(MAXRUN*6*2*3);
const edgeGeo=new THREE.BufferGeometry();
edgeGeo.setAttribute('position',new THREE.BufferAttribute(edgePos,3));
const edges=new THREE.LineSegments(edgeGeo,
  new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.45}));
scene.add(edges);
function rim(n,x,z,y){
  let o=n*36;
  for(let k=0;k<6;k++){
    const j=(k+1)%6;
    edgePos[o++]=x+SIN[k]; edgePos[o++]=y; edgePos[o++]=z+COS[k];
    edgePos[o++]=x+SIN[j]; edgePos[o++]=y; edgePos[o++]=z+COS[j];
  }
}

/* the hover ring: a hexagon lying just over whatever is under the cursor */
const ringPts=[];
for(let k=0;k<=6;k++){ const a=Math.PI/180*(60*k);
  ringPts.push(new THREE.Vector3(Math.sin(a)*1.04,0,Math.cos(a)*1.04)); }
const ring=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(ringPts),
  new THREE.LineBasicMaterial({color:0xffffff}));
ring.visible=false; scene.add(ring);

const M4=new THREE.Matrix4(), Q=new THREE.Quaternion(),
      P=new THREE.Vector3(), S=new THREE.Vector3(), C=new THREE.Color();
function place(mesh,n,x,z,lo,hi){
  const h=Math.max(hi-lo,0.0001);
  P.set(x,(lo+hi)/2,z); S.set(1,h,1);
  mesh.setMatrixAt(n,M4.compose(P,Q,S));
}
function hide(mesh,n){
  P.set(0,-999,0); S.set(0.0001,0.0001,0.0001);
  mesh.setMatrixAt(n,M4.compose(P,Q,S));
}

/* the same colours the flat renderer used, handed over as a THREE.Color */
const blend=(a,b,f)=>a.map((v,n)=>v+(b[n]-v)*f);
let SHOW_MOIST=false;
function tint(t){
  const k=Math.max(-H_MAX,Math.min(H_MAX,t.h))/H_MAX;
  const a  = t.vol?[60,52,55]   :[74,70,63];
  const up = t.vol?[178,166,172]:[240,221,178];
  const dn = t.vol?[17,15,18]   :[22,22,25];
  let c = k>=0 ? blend(a,up,k) : blend(a,dn,-k);
  if(t.soil>0) c=blend(c,[96,68,40],0.16+0.5*(t.soil/5));
  if(t.life)   c=blend(c,[86,150,70],0.78);
  if(SHOW_MOIST && t.liq===NONE)
    c=blend(c,[74,158,214],Math.min(1,t.moist/12)*0.75);
  C.setRGB(c[0]/255,c[1]/255,c[2]/255);
  return C;
}

function rebuild(){
  let n=0;
  for(let i=0;i<T.length;i++){
    const t=T[i];
    /* walk the column, one prism per unbroken run of solid cells */
    let z=0;
    while(z<ZN){
      if(!cell(i,z)){ z++; continue; }
      let e=z; while(e+1<ZN && cell(i,e+1)) e++;
      place(ground,n,t.x,t.y,(Z0+z)*RISE,(Z0+e+1)*RISE);
      ground.setColorAt(n,tint(t));
      rim(n,t.x,t.y,(Z0+e+1)*RISE+0.004);
      instHex[n]=i; n++;
      z=e+1;
    }
    if(t.liq===WATER){
      place(water,i,t.x,t.y,t.h*RISE,Math.max(t.ls*RISE,t.h*RISE+0.05));
      hide(lava,i);
    } else if(t.liq===LAVA){
      place(lava,i,t.x,t.y,t.h*RISE,Math.max(t.ls*RISE,t.h*RISE+0.05));
      hide(water,i);
    } else { hide(water,i); hide(lava,i); }
  }
  for(let k=n;k<MAXRUN;k++){ hide(ground,k); rim(k,0,-999,0); }
  ground.count=n;
  ground.instanceMatrix.needsUpdate=true;
  ground.instanceColor.needsUpdate=true;
  edgeGeo.attributes.position.needsUpdate=true;
  edgeGeo.computeBoundingSphere();
  water.instanceMatrix.needsUpdate=true;
  lava.instanceMatrix.needsUpdate=true;
  /* An InstancedMesh measures itself ONCE, lazily, and caches it. Both liquid
     meshes were first measured while every instance was still parked out of
     sight, so they cached a zero-radius sphere and were frustum-culled from
     then on — placed correctly, updated correctly, and never drawn. Re-measure
     whenever the instances move. */
  ground.computeBoundingSphere();
  water.computeBoundingSphere();
  lava.computeBoundingSphere();
}

/* ---- picking: the raycaster hands back the instance, which IS the hex ---- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let HOVER=-1;
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.x=((ev.clientX-r.left)/r.width)*2-1;
  ndc.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,cam);
  let best=null, bestHex=-1;
  for(const m of [ground,water,lava]){
    const hit=ray.intersectObject(m,false)[0];
    if(!hit) continue;
    /* ground instances are runs now, so the hex comes from a lookup; the
       liquid meshes are still one instance per hex */
    const hex = m===ground ? instHex[hit.instanceId] : hit.instanceId;
    if(hex>=0 && (!best||hit.distance<best.distance)){ best=hit; bestHex=hex; }
  }
  return bestHex;
}
function hover(i){
  HOVER=i;
  if(i<0) ring.visible=false;
  else{
    const t=T[i];
    ring.position.set(t.x, surf(t)*RISE+0.03, t.y);
    ring.material.color.set(
      POWER.k==='deluge'?0x5aafe1 : POWER.k==='lava'?0xe0793c :
      POWER.k==='seed'?0x7fd06a : POWER.d>0?0xffffff : 0xc9a86a);
    ring.visible=true;
  }
  drawInfo();
}
renderer.domElement.addEventListener('pointermove',e=>{
  const i=pick(e); if(i!==HOVER) hover(i);
});
renderer.domElement.addEventListener('pointerleave',()=>hover(-1));
/* an orbit drag ends in a click event too, so only a still pointer counts */
let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('click',e=>{
  if(!downAt) return;
  const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);
  downAt=null;
  if(moved>4) return;
  const i=pick(e);
  if(use(i,POWER)){ rebuild(); hover(i); }
});

function resize(){
  const w=board.clientWidth||900, h=board.clientHeight||660;
  renderer.setSize(w,h,false);
  const a=w/h;
  if(cam.isOrthographicCamera){
    cam.left=-SPAN*a; cam.right=SPAN*a; cam.top=SPAN; cam.bottom=-SPAN;
  } else cam.aspect=a;
  cam.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

/* ---- the side panel, unchanged: plain DOM reading the sim ---- */
function drawInfo(){
  const el=document.getElementById('info');
  if(HOVER<0){ el.innerHTML='<h4>hex</h4><span class="none">hover the board</span>'; return; }
  const t=T[HOVER];
  const row=(k,v,cls)=>'<div class="r'+(cls==='q'?' q':'')+'"><span>'+k+
    '</span><span'+(cls&&cls!=='q'?' class="'+cls+'"':'')+'>'+v+'</span></div>';
  const b=basinAt(HOVER);
  let h='<h4>'+t.q+', '+t.r+'</h4>';
  h+=row('ground', t.h + (t.vol?'  basalt':'  rock'), t.vol?'v':'');
  h+=row('relief', t.rel);
  h+= t.liq===WATER ? row('water','surface '+t.ls,'w')
    : t.liq===LAVA  ? row('lava','surface '+t.ls,'l')
    : row('basin', b ? 'fills to '+b.level : '—', b?'':'q');
  h+=row('moisture', t.moist||'—', t.moist?'w':'q');
  h+=row('heat',     t.temp ||'—', t.temp ?'l':'q');
  h+=row('soil',     t.soil>0 ? t.soil.toFixed(2) : '—', t.soil>0?'s':'q');
  h+=row('life',     t.life ? 'growing' : (habit(t)?'could grow':'—'), t.life?'g':'q');
  el.innerHTML=h;
}
function drawMenu(){
  document.getElementById('powers').innerHTML=POWERS.map(p=>
    '<button class="pw'+(p.k===POWER.k?' on':'')+'" data-k="'+p.k+'">'+
    p.ic+'<span>'+p.nm+'</span></button>').join('');
  /* ONLY the power buttons — the View panel shares the .pw styling, and an
     unscoped query once stole its clicks and set POWER to undefined */
  document.querySelectorAll('#powers .pw').forEach(b=>b.onclick=()=>{
    POWER=POWERS.find(p=>p.k===b.dataset.k); drawMenu(); hover(HOVER);
  });
}
const ovMoist=document.getElementById('ovMoist');
ovMoist.onclick=()=>{ SHOW_MOIST=!SHOW_MOIST;
  ovMoist.classList.toggle('on',SHOW_MOIST); rebuild(); };
const ovProj=document.getElementById('ovProj');
ovProj.onclick=()=>{ ortho=!ortho;
  ovProj.classList.toggle('on',!ortho);
  ovProj.querySelector('span').textContent = ortho?'Flat view':'Deep view';
  cam=makeCam(); resize(); };

/* A module's scope is private, so nothing here is reachable from devtools.
   Being able to poke the board from the console is worth one deliberate
   global — it is how the flat renderer was checked, and it is the only way
   to drive the sim by hand now. */
window.POT={T,at,flood,use,rebuild,basinAt,habit,POWERS,scene,
  CELL,TOP,cell,retop,ZN,Z0,AIR,ROCK,BASALT,instHex,ground,
  camera:()=>cam, hover:i=>hover(i),
  get power(){ return POWER.k },
  set power(k){ POWER=POWERS.find(p=>p.k===k)||POWER; drawMenu(); }};

function tick(){ controls.update(); renderer.render(scene,cam);
  requestAnimationFrame(tick); }
drawMenu(); flood(); rebuild(); resize(); drawInfo(); tick();
</script>
</body>
