<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uplift</title>
<style>
  html,body{margin:0;min-height:100%;background:#08090c}
  body{color:#8b929c;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:13px;font-weight:400;letter-spacing:4px;text-transform:uppercase;
    color:#c9a86a;margin:0 0 12px}
  .main{display:grid;grid-template-columns:1fr 176px;gap:14px;align-items:start}
  @media(max-width:780px){.main{grid-template-columns:1fr}}
  #board{background:#05070a;border:1px solid #1d222a;position:relative}
  #info{position:absolute;left:10px;top:10px;width:184px;pointer-events:none;
    background:rgba(10,12,16,.92);border:1px solid #1d222a;font-size:11px;
    line-height:1.55;padding:8px 10px}
  #info h4{margin:0 0 5px;font-size:8.5px;font-weight:400;letter-spacing:1.8px;
    text-transform:uppercase;color:#464e58}
  #info .r{display:flex;justify-content:space-between;gap:8px}
  #info .r span:first-child{color:#5c646e}
  #info .r span:last-child{color:#c3cad3;font-variant-numeric:tabular-nums}
  #info .r.q span:last-child{color:#6f7681}
  #info .none{color:#464e58}
  #info .w{color:#6fb6e8} #info .l{color:#e8853c}
  #info .g{color:#82c46a} #info .s{color:#c39a5e} #info .v{color:#a99aa8}
  #cv{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
  .hint{padding:8px 2px 0;letter-spacing:.5px;color:#464e58}
  .hint b{color:#8b929c;font-weight:400}

  .menu{border:1px solid #1d222a;background:#0e1116}
  .menu h2{margin:0;padding:9px 11px;font-size:9px;font-weight:400;letter-spacing:2px;
    text-transform:uppercase;color:#464e58;border-bottom:1px solid #1d222a}
  .pw{display:flex;align-items:center;gap:10px;width:100%;padding:11px;
    border-bottom:1px solid #12161c;border-left:2px solid transparent;
    background:none;color:#8b929c;font-family:inherit;font-size:12px;
    letter-spacing:1px;cursor:pointer;text-align:left}
  .pw:last-child{border-bottom:none}
  .pw:hover{background:#12151b}
  .pw svg{width:18px;height:18px;flex:0 0 18px;stroke:#6f7681;fill:none;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .pw.on{border-left-color:#c9a86a;color:#e5dcc8;background:#171510}
  .pw.on svg{stroke:#c9a86a}
</style>
</head>
<body>
<div class="wrap">
  <h1>Uplift</h1>
  <div class="main">
    <div>
      <div id="board"><canvas id="cv"></canvas><div id="info"></div></div>
      <div class="hint"><b>click a hex</b> — soil gathers below high ground on its
        own; Seed greens any patch that has soil, water within reach, and no lava.</div>
    </div>
    <div>
      <div class="menu">
        <h2>Powers</h2>
        <div id="powers"></div>
      </div>
      <div class="menu" style="margin-top:14px">
        <h2>View</h2>
        <button class="pw" id="rotL"><svg viewBox="0 0 18 18">
          <path d="M15 9a6 6 0 1 1-1.8-4.3"/><path d="M13.2 1.5v3.2H10"/></svg>
          <span>Turn left</span></button>
        <button class="pw" id="rotR"><svg viewBox="0 0 18 18">
          <path d="M3 9a6 6 0 1 0 1.8-4.3"/><path d="M4.8 1.5v3.2H8"/></svg>
          <span>Turn right</span></button>
        <button class="pw" id="ovMoist"><svg viewBox="0 0 18 18">
          <path d="M9 2.2c3.1 3.6 4.7 5.9 4.7 7.9a4.7 4.7 0 0 1-9.4 0c0-2 1.6-4.3 4.7-7.9z"/>
          </svg><span>Moisture</span></button>
      </div>
    </div>
  </div>
</div>

<script>
/*==CORE-START==*/
/* ======================================================================
   An island of hexes. Four powers. Two liquids that behave the same way.

   STORED per hex:  h    ground height
                    vol  is this ground VOLCANIC ROCK
                    src  what stands here — nothing, water, or lava. Both
                         liquids are ENDLESS SOURCES once they exist.

   DERIVED, rebuilt from scratch after every click:
                    liq    what is actually standing here
                    ls     the surface it stands at
                    moist  how many neighbours are water   (the sea counts)
                    temp   how many neighbours are lava
                    Both auras are plain counts. Neither accumulates and
                    neither can ever turn into the liquid it came from.

   THE RULES
     A hex is a BASIN if a liquid put on it could not get away — if it must
     rise above its own ground to escape. Off the rim is the WALL of the pot,
     bare rock at height 5, which nothing can change.
     DELUGE fills the connected basin you click with water, to the brim —
     and basins NEST, so the water rises only to the first rim it meets.
     LAVA fills that same basin with lava instead. Off a basin, neither does
     anything: it runs away.
     The floor starts below the wall, so THE WHOLE POT IS ONE BASIN. Deluge
     undug ground and it fills to the brim, all of it. Only ground raised
     level with the wall lets a liquid spill over and be lost.
     Lava that TOUCHES WATER — a lake, or water poured onto it —
     sets on the spot into VOLCANIC ROCK, level with the basin's brim. That
     is the only way volcanic rock is ever made, and the only thing that
     ever removes lava.
   ====================================================================== */
/* Off the rim is not sea any more — it is the WALL of the pot: bare rock at
   this height, all the way round, and nothing the player has can touch it.
   It stands above the floor, so the whole pot is one basin: aim Deluge at
   undug ground and it fills to the brim. The preview rings all 127 hexes
   when that is what a click would do. */
const R=6, H_MAX=12, WALL=5;
const NONE=0, WATER=1, LAVA=2;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];   /* E NE NW W SW SE */

const T=[], idx=new Map();
for(let q=-R;q<=R;q++){
  const lo=Math.max(-R,-q-R), hi=Math.min(R,-q+R);
  for(let r=lo;r<=hi;r++){
    idx.set(q+','+r,T.length);
    T.push({q,r,x:Math.sqrt(3)*(q+r/2),y:1.5*r,
            h:0,vol:false,src:NONE,seed:false,
            liq:NONE,ls:0,moist:0,temp:0,rel:0,soil:0,life:false});
  }
}
for(const t of T) t.nb=DIRS.map(d=>{
  const j=idx.get((t.q+d[0])+','+(t.r+d[1])); return j===undefined?-1:j});
/* the ring at distance TWO — moisture reaches further than one hex now */
const RING2=[];
for(let dq=-2;dq<=2;dq++) for(let dr=-2;dr<=2;dr++)
  if((Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2===2) RING2.push([dq,dr]);
for(const t of T) t.nb2=RING2.map(d=>{
  const j=idx.get((t.q+d[0])+','+(t.r+d[1])); return j===undefined?-1:j});
for(const t of T) t.coast=t.nb.filter(j=>j<0).length;
const at=(q,r)=>{const i=idx.get(q+','+r);return i===undefined?-1:i};
const surf = t => t.liq!==NONE ? t.ls : t.h;

/* ---------------------------------------------------------------------
   THE VERTEX LATTICE — the graph rivers run on.

   Rivers do not run through the middles of hexes, they run along the SEAMS
   between them, so they need their own graph. Every hex corner is a NODE,
   shared by the three hexes meeting there (the pot wall standing in for any
   that are off the board), and every hex edge is an ARC joining two nodes.
   A node's height is the average of its three hexes — the height you would
   get by interpolating between hex centres.

   That average is the whole reason seam rivers are possible. Two hexes at
   the same height have no drop between them and can never exchange, so on
   the hex graph the seam between them carries nothing. But the two ENDS of
   that seam average in different third hexes, so they sit at different
   heights and water runs ALONG it. Measured on a peak of 1 over six 0s: the
   seam direction is lower than the neighbour direction at every radius.

   Heights are carried in THIRDS, as integers, so equal heights compare
   exactly and no float ever decides where a river goes.
   --------------------------------------------------------------------- */
const VERT=[], CORNERS=[], ARC=[], HARC=[];
{
  const vat=new Map(), aat=new Map();
  const key2=(x,y)=>(Math.round(x*1000)/1000).toFixed(3)+','+
                    (Math.round(y*1000)/1000).toFixed(3);
  for(let i=0;i<T.length;i++){
    const row=[];
    for(let c=0;c<6;c++){
      const a=Math.PI/180*(60*c-30);          /* same corner order as vx() */
      const x=T[i].x+Math.cos(a), y=T[i].y+Math.sin(a);
      const k=key2(x,y);
      let v=vat.get(k);
      if(v===undefined){ v=VERT.length; vat.set(k,v);
        VERT.push({x,y,hex:[],arc:[],h3:0,surf3:0,in:0}); }
      VERT[v].hex.push(i); row.push(v);
    }
    CORNERS.push(row);
  }
  /* which two corners an edge spans, in DIRS order. Checked against the
     WALLS table the renderer already uses: dir 5 -> (1,2), dir 4 -> (2,3). */
  const CPAIR=[[0,1],[5,0],[4,5],[3,4],[2,3],[1,2]];
  for(let i=0;i<T.length;i++){
    const row=[];
    for(let d=0;d<6;d++){
      const a=CORNERS[i][CPAIR[d][0]], b=CORNERS[i][CPAIR[d][1]];
      const k=Math.min(a,b)+','+Math.max(a,b);
      let n=aat.get(k);
      if(n===undefined){ n=ARC.length; aat.set(k,n); ARC.push({a,b,flow:0,drop:0,side:[]}); }
      ARC[n].side.push(i);       /* the one or two hexes this seam separates */
      row.push(n);
    }
    HARC.push(row);
  }
  for(let k=0;k<ARC.length;k++){ VERT[ARC[k].a].arc.push(k); VERT[ARC[k].b].arc.push(k); }
}

/* ---------------------------------------------------------------------
   FILL — pour a liquid in at these hexes and let it rise until it finds a
   way out. Returns what ends up submerged, and the level it stands at.

   The water rises to the FIRST rim it meets, not to the ultimate way out to
   the sea. That is what makes basins NEST: a hex at -2 in the middle of a
   -1 plateau fills on its own, to -1, while clicking the plateau itself
   fills the whole plateau to 0. You choose the scale by where you click.
   --------------------------------------------------------------------- */
function fillFrom(seeds){
  const inS=new Set(seeds);
  /* the HIGHEST seed, not the lowest: adjacent wet hexes are one pool, and
     the water has to stand above all of them. Taking the lowest left a
     shallow seed with its own surface below its own bed. */
  let level=-Infinity;
  for(const s of seeds) level=Math.max(level,T[s].h);
  const hOf = x => x<0 ? WALL : T[x].h;         /* off the rim is the pot wall */
  const fr=[];
  const spread=i=>{ for(const j of T[i].nb) if(j<0||!inS.has(j)) fr.push(j); };
  for(const s of seeds) spread(s);
  while(fr.length){
    let b=0;
    for(let k=1;k<fr.length;k++) if(hOf(fr[k])<hOf(fr[b])) b=k;
    const f=fr.splice(b,1)[0];
    if(f>=0 && inS.has(f)) continue;
    /* the lowest thing around us stands higher: that is the rim, and the
       liquid rests against it */
    if(hOf(f)>level) return {cells:[...inS], level:hOf(f), open:false};
    /* it reached the wall at or above its own level — it spills over and is
       lost. Only possible once the ground has been raised level with the rim. */
    if(f<0) return {cells:[...inS], level:WALL, open:true};
    inS.add(f); spread(f);
  }
  return {cells:[...inS], level, open:true};
}
/* the basin under a hex, or null if a liquid put there would run away.
   Deluge and Lava both read this same answer. */
function basinAt(i){
  if(i<0) return null;
  const f=fillFrom([i]);
  return (f.open || f.level<=T[i].h) ? null : f;
}

function flood(){
  /* Setting lava raises the ground, which can put a new basin in reach of a
     new liquid, so this repeats until the board stops changing. Solidifying
     only ever raises ground, so it always terminates. */
  for(let guard=0; guard<24; guard++){
    for(const t of T){ t.liq=NONE; t.ls=t.h; }

    /* Adjacent sources are one body — and so are sources that do NOT touch
       but end up in the same pool. A source can sit inside a basin filled
       from somewhere else, and fillFrom will submerge it without ever
       knowing it was there. Group by touching first, then merge any two
       groups whose fills overlap and fill again, until none overlap.

       Without the merge the two bodies both wrote their own level over the
       shared hex and the last one won, leaving that hex holding water at a
       level its own neighbours did not share. It corrected itself on the
       next click — once the pool had written src across all its cells the
       groups touched and merged — so the board was quietly one click stale.
       Each merge removes a group, so this always terminates. */
    const seen=new Array(T.length).fill(false), groups=[];
    for(let i=0;i<T.length;i++){
      if(seen[i]||T[i].src===NONE) continue;
      const grp=[i], q=[i]; seen[i]=true;
      while(q.length){
        const k=q.pop();
        for(const j of T[k].nb){
          if(j<0||seen[j]||T[j].src===NONE) continue;
          seen[j]=true; grp.push(j); q.push(j);
        }
      }
      groups.push(grp);
    }
    let bodies=[];
    for(;;){
      bodies=groups.map(grp=>Object.assign({grp},fillFrom(grp)));
      let a=-1,b=-1;
      const owner=new Map();
      for(let n=0;n<bodies.length && b<0;n++)
        for(const c of bodies[n].cells){
          if(!owner.has(c)){ owner.set(c,n); continue; }
          a=owner.get(c); b=n; break;
        }
      if(b<0) break;
      groups[a]=groups[a].concat(groups[b]);
      groups.splice(b,1);
    }
    for(const bd of bodies){
      bd.wat=bd.grp.some(i=>T[i].src===WATER);
      bd.lav=bd.grp.some(i=>T[i].src===LAVA);
    }
    for(const b of bodies){
      if(b.open){ for(const i of b.cells) T[i].src=NONE; continue; }  /* it ran away */
      const kind=b.wat?WATER:LAVA;
      for(const i of b.cells){ T[i].liq=kind; T[i].ls=b.level; T[i].src=kind; }
    }
    /* lava meeting water sets into volcanic rock, level with the brim.
       With no sea there is only one route left: rain into a lava pool. */
    let set=false;
    for(const b of bodies){
      if(!b.lav||b.open) continue;
      const quenched = b.wat || b.cells.some(i =>
        T[i].nb.some(j=>j>=0 && T[j].liq===WATER));
      if(!quenched) continue;
      for(const i of b.cells){
        T[i].h=b.level; T[i].vol=true; T[i].src=NONE; T[i].liq=NONE;
      }
      set=true;
    }
    if(set) continue;                        /* the ground moved — solve again */
    for(let i=0;i<T.length;i++) if(T[i].src!==NONE && T[i].liq===NONE) T[i].src=NONE;
    break;
  }
  /* the two auras: plain counts of what is next to you */
  for(const t of T){
    let m=0, tp=0;
    /* MOISTURE reaches two hexes: two points for water alongside, one for
       water a hex further off. The wall is rock and gives nothing, so all of
       it comes from water the player actually put on the board. Still a plain
       count — it accumulates nothing and can never turn into water itself. */
    if(t.liq===NONE){
      for(const j of t.nb)  if(j>=0 && T[j].liq===WATER) m+=2;
      for(const j of t.nb2) if(j>=0 && T[j].liq===WATER) m+=1;
    }
    if(t.liq!==LAVA) for(const j of t.nb) if(j>=0 && T[j].liq===LAVA) tp++;
    t.moist=m; t.temp=tp;
  }
  soils();
  lives();
  rains();          /* a leaf: it reads settled ground and water, and nothing reads it */
}

/* ---------------------------------------------------------------------
   SOIL is not placed. It is what the shape of the land does with itself.

   For each hex, d is the drop to each lower neighbour and D the sum of all
   six. D measures how EXPOSED a hex is, so the middle of a plateau does not
   weather at all and only its edges do.

     WEATHERING  a hex breaks rock down at  D x (1 + moisture)  — water is
                 what does the work, so sea cliffs and lake shores go
                 fastest — doubled on basalt, and nil where life has bound
                 the ground with roots.
     TRANSPORT   it hands that load to each lower neighbour in proportion to
                 that neighbour's own drop, so sediment follows the steepest
                 way down. Of what it RECEIVES it keeps 1/(1+D): flat ground
                 keeps everything it is handed, steep ground keeps almost
                 none. Freshly weathered rock always moves on, which is what
                 keeps high ground bare.

   Carried as a real number and only bucketed to 0-5 at the end. Splitting
   it into whole units meant handing out a remainder, and the remainder
   always went the same way round the ring — so a perfectly symmetric peak
   grew a lopsided apron, always to the east. Determinism is the point;
   a fixed direction winning is not.
   --------------------------------------------------------------------- */
/* Off the rim is the wall, so for sediment it is simply ground at WALL.
   It stands above the floor, which means nothing washes out of the pot —
   what the wall sheds, the pot keeps. */
const BED=WALL, RATE=0.35, SOIL_MAX=5;
function soils(){
  const n=T.length, load=new Array(n).fill(0), fall=[];
  /* THE SKIRTS. The wall is rock like any other, and it weathers like any
     other: each face standing above a hex hands that hex what it sheds,
     by the same D x RATE the rest of the board uses. Freshly weathered rock
     always moves on, so the wall keeps none of it. This is why a fresh pot
     is not bare — there is soil at its skirts before you touch anything. */
  for(let i=0;i<n;i++){
    const drop = WALL - T[i].h;
    if(drop>0) load[i] += T[i].coast * drop * RATE;
  }
  for(let i=0;i<n;i++){
    const d=[]; let D=0;
    for(let k=0;k<6;k++){
      const j=T[i].nb[k], hh = j<0 ? BED : T[j].h;
      const dd=Math.max(0, T[i].h-hh);
      d.push(dd); D+=dd;
    }
    fall.push(d); T[i].rel=D;
  }
  /* high ground first: a hex can only be fed from strictly above it, so by
     the time it is reached its load is complete. Hexes at equal height never
     exchange, so ties cannot change the answer. */
  const order=T.map((t,i)=>i).sort((a,b)=>T[b].h-T[a].h);
  for(const i of order){
    const t=T[i], d=fall[i], D=t.rel;
    if(t.life){ t.soil=Math.min(SOIL_MAX,load[i]); continue; }   /* roots hold it */
    const weather = D * (1+t.moist) * (t.vol?2:1) * RATE;
    if(D===0){ t.soil=Math.min(SOIL_MAX, load[i]+weather); continue; }  /* nowhere to go */
    const keep=load[i]/(1+D);
    t.soil=Math.min(SOIL_MAX, keep);
    const move=(load[i]-keep)+weather;
    for(let k=0;k<6;k++){
      if(d[k]<=0) continue;
      const j=T[i].nb[k];
      if(j>=0) load[j] += move*d[k]/D;      /* proportional — nothing left over */
    }
  }
}
/* ---------------------------------------------------------------------
   LIFE holds where there is soil to root in, water within reach, and no
   lava beside it. A seed greens its whole connected patch at once, and
   every living hex becomes a seed itself, so the patch remembers where it
   is. Change the ground and it re-solves — it can be cut in two, and it
   can die.
   --------------------------------------------------------------------- */
const habit = t => t.liq===NONE && t.soil>=1 && t.moist>=1 && t.temp===0;
/* Life BINDS the ground it stands on, and habitability needs soil to stand
   in, so the two define each other. Life owns that knot rather than leaving
   it to whoever calls: it re-solves the soil itself, and keeps doing it until
   life stops moving.

   One pass each was not enough. It left the board a click stale wherever a
   patch had just greened or just died, and even after re-solving the soil
   once, life was still being decided on the soil from half a step earlier.
   That was harmless while moisture only reached one hex and life was rare —
   zero cases in a thousand boards. Widening moisture to two hexes made life
   common enough to find it: one board in two hundred settled to a different
   patch when left alone. The seeds are taken ONCE at the top, because
   t.seed = t.life at the bottom would otherwise eat them between passes. */
function lives(){
  const seeds=T.map(t=>t.seed);
  let prev='';
  for(let pass=0; pass<8; pass++){
    for(const t of T) t.life=false;
    const q=[];
    for(let i=0;i<T.length;i++) if(seeds[i] && habit(T[i])){ T[i].life=true; q.push(i); }
    while(q.length){
      const i=q.pop();
      for(const j of T[i].nb)
        if(j>=0 && !T[j].life && habit(T[j])){ T[j].life=true; q.push(j); }
    }
    soils();                                  /* the soil life now binds */
    const now=T.map(t=>t.life?1:0).join('');
    if(now===prev) break;
    prev=now;
  }
  for(const t of T) t.seed = t.life;          /* it remembers itself, like water */
}
/* ---------------------------------------------------------------------
   RIVERS — where the rain goes.

   Rain is MOISTURE meeting HEIGHT, and both are read off the hex itself.

   A hex rains when it is damp enough — above MOIST_MIN — and it rains harder
   the higher it stands. That is orography in one line: moist air coming off
   the water, forced up over ground near it, and dropping what it carries.
   A pot with no water has no moisture anywhere and so no rivers anywhere,
   which falls out rather than being a rule.

   The point of it is that it is LOCAL. The rain used to be a global sum —
   total standing water anywhere on the board — so pouring a lake in one
   corner changed rivers in the other and nothing you could look at explained
   why. Now a hex's rain depends on that hex's own two readings, both of
   which are already on the panel.

   Each hex sheds its rain to its six corners in proportion to how far each
   corner sits below it, then the lattice routes it downhill by STEEPEST
   DESCENT: all of it to the lowest way out, split equally when several tie.
   Not shared out in proportion — that braids every river into a delta and
   nothing ever clears the threshold. And not broken by ring order either:
   that is precisely how a symmetric peak grew a lopsided apron, always to
   the east, back when soil handed out a remainder. A tie is a real saddle
   and a real saddle really does fork.

   Level ground is gathered into REGIONS of equal height and each region
   routes as one. That is what carries a river across a lake: a lake is
   already brim-full by construction — fillFrom stops at the first rim it
   meets — so it is a flat region that spills at its lowest way out. Rivers
   pass through lakes rather than dying in them, and no volume is tracked
   anywhere. A hollow with no way out is a sink and the water stops there.
   --------------------------------------------------------------------- */
/* RAIN is the abundance knob, as RATE is for soil. MOIST_MIN is the damp a
   hex needs before it rains at all — moisture runs 0..24 now (two a side,
   one at a hex's remove, twelve hexes in that outer ring). FALL_MIN is in
   THIRDS, and because two nodes on a seam share two of their three hexes, a
   seam's drop in thirds is exactly the height difference between the hexes
   capping its ends — so 3 means a three-step cliff. Calibrated against a
   board somebody would actually build rather than against extremes, and none
   of it playtested hard. */
const RAIN=0.2, MOIST_MIN=2, RIVER_MIN=1.0, FALL_MIN=3;
function rains(){
  for(const A of ARC){ A.flow=0; A.drop=0; }
  for(const t of T){ t.river=0; t.disc=0; }
  let wet=0;
  for(const t of T) if(t.liq===WATER) wet++;
  if(!wet) return;                      /* a dry pot has no weather at all */

  /* node heights, in thirds. top3 is the real surface — ground, or the lid
     of any water standing over it. surf3 is what we ROUTE on, and it gets
     raised where a pit has to be filled. */
  for(const v of VERT){
    let s=0, w=-Infinity;
    for(const i of v.hex){ s+=T[i].h; if(T[i].liq!==NONE) w=Math.max(w,T[i].ls); }
    s += WALL*(3-v.hex.length);          /* corners off the board are the wall */
    v.h3=s; v.in=0;
    v.wet = w!==-Infinity && 3*w>=s;
    v.top3 = w===-Infinity ? s : Math.max(s, 3*w);
    v.surf3 = v.top3;
  }
  for(const A of ARC) A.drop=Math.abs(VERT[A.a].top3-VERT[A.b].top3);

  /* rain onto the high ground, shed to the corners below each hex */
  for(let i=0;i<T.length;i++){
    const t=T[i];
    if(t.liq!==NONE) continue;           /* it falls straight in */
    const r=RAIN*Math.max(0,t.moist-MOIST_MIN)*Math.max(0,t.h);
    if(r<=0) continue;
    const h3=3*t.h, dd=[]; let D=0;
    for(let c=0;c<6;c++){
      const d=Math.max(0,h3-VERT[CORNERS[i][c]].top3); dd.push(d); D+=d;
    }
    if(D===0) continue;                  /* every corner stands over it */
    for(let c=0;c<6;c++) if(dd[c]>0) VERT[CORNERS[i][c]].in += r*dd[c]/D;
  }

  /* gather level ground — and every lake — into regions that route as one */
  const reg=new Array(VERT.length).fill(-1);
  let regs=[];
  const group=()=>{
    reg.fill(-1); regs=[];
    for(let v=0;v<VERT.length;v++){
      if(reg[v]>=0) continue;
      const n=regs.length, cells=[v], q=[v]; reg[v]=n;
      let holds=VERT[v].wet;
      while(q.length){
        const u=q.pop();
        for(const k of VERT[u].arc){
          const w=ARC[k].a===u?ARC[k].b:ARC[k].a;
          if(reg[w]<0 && VERT[w].surf3===VERT[u].surf3){
            reg[w]=n; cells.push(w); q.push(w); if(VERT[w].wet) holds=true; }
        }
      }
      regs.push({cells, h3:VERT[v].surf3, in:0, holds});
    }
  };
  /* Averaging three hexes invents little pits that are not really in the
     ground — a node lower than everything around it, where a river would
     simply vanish. Left alone they swallowed 86% of the rain.

     PRIORITY FLOOD, from the lowest node on the board outwards. A node's
     routing height becomes the lowest level at which it can still reach that
     outlet — so a real hollow is raised to its own brim and spills, exactly
     as fillFrom does for hexes, while everything already draining is left at
     its true height.

     It has to be seeded from the outlet rather than fixed pit by pit. The
     pot is SEALED: its lowest ground has no way out at all, so raising every
     sink to its lowest neighbour never terminated sensibly — it walked the
     whole floor upwards until it merged into the nearest lake, and a river
     arriving at a lake was declared to have arrived at the bottom of the
     world. Rivers died in lakes instead of running through them. */
  const fill=new Array(VERT.length).fill(Infinity), heap=[];
  const push=(h,v)=>{ heap.push([h,v]); let n=heap.length-1;
    while(n>0){ const p=(n-1)>>1; if(heap[p][0]<=heap[n][0]) break;
      const t=heap[p]; heap[p]=heap[n]; heap[n]=t; n=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop();
    if(heap.length){ heap[0]=last; let n=0;
      for(;;){ const l=2*n+1, r=l+1; let m=n;
        if(l<heap.length&&heap[l][0]<heap[m][0]) m=l;
        if(r<heap.length&&heap[r][0]<heap[m][0]) m=r;
        if(m===n) break; const t=heap[m]; heap[m]=heap[n]; heap[n]=t; n=m; } }
    return top; };
  let low=0;
  for(let v=1;v<VERT.length;v++) if(VERT[v].top3<VERT[low].top3) low=v;
  fill[low]=VERT[low].top3; push(fill[low],low);
  while(heap.length){
    const [h,v]=pop();
    if(h>fill[v]) continue;
    for(const k of VERT[v].arc){
      const w=ARC[k].a===v?ARC[k].b:ARC[k].a;
      const nh=Math.max(VERT[w].top3,h);
      if(nh<fill[w]){ fill[w]=nh; push(nh,w); }
    }
  }
  for(let v=0;v<VERT.length;v++) VERT[v].surf3=fill[v];
  group();
  for(let v=0;v<VERT.length;v++) regs[reg[v]].in += VERT[v].in;

  /* high to low: a region can only be fed from strictly above it, so by the
     time it is reached its total is complete. Equal regions never exchange,
     so ties in the ordering cannot change the answer. */
  const order=regs.map((g,n)=>n).sort((a,b)=>regs[b].h3-regs[a].h3);
  for(const n of order){
    const g=regs[n];
    if(g.in<=0) continue;
    let best=Infinity, exits=[];
    for(const v of g.cells) for(const k of VERT[v].arc){
      const w=ARC[k].a===v?ARC[k].b:ARC[k].a;
      if(reg[w]===n) continue;
      const hw=VERT[w].surf3;
      if(hw>=g.h3) continue;
      if(hw<best){ best=hw; exits=[[k,w]]; }
      else if(hw===best) exits.push([k,w]);
    }
    if(!exits.length) continue;          /* a sink — the water stops here */
    const share=g.in/exits.length;
    for(const [k,w] of exits){ ARC[k].flow+=share; regs[reg[w]].in+=share; }
  }

  /* read it back onto the hexes, for the panel and for hit-free drawing */
  for(let i=0;i<T.length;i++){
    let mx=0;
    for(let d=0;d<6;d++){ const f=ARC[HARC[i][d]].flow; if(f>mx) mx=f; }
    T[i].river=mx>=RIVER_MIN?mx:0; T[i].disc=mx;
  }
}
const isRiver = k => ARC[k].flow>=RIVER_MIN;
const isFall  = k => ARC[k].flow>=RIVER_MIN && ARC[k].drop>=FALL_MIN;

/* the patch a seed here would green — for the overlay */
function patchAt(i){
  if(i<0||!habit(T[i])) return null;
  const cells=[i], seen=new Set([i]), q=[i];
  while(q.length){
    const k=q.pop();
    for(const j of T[k].nb)
      if(j>=0 && !seen.has(j) && habit(T[j])){ seen.add(j); q.push(j); cells.push(j); }
  }
  return cells;
}

const legal=(i,p)=> p.d===0 ? true
                  : p.d>0 ? T[i].h<H_MAX : T[i].h>-H_MAX;
function use(i,p){
  if(i==null||i<0||!T[i]||!legal(i,p)) return false;
  if(p.k==='seed'){
    if(!habit(T[i])) return false;               /* nothing will take there */
    T[i].seed=true;
  } else if(p.d===0){
    if(!basinAt(i)) return false;                /* it just runs off */
    T[i].src = p.k==='lava' ? LAVA : WATER;
  } else T[i].h+=p.d;
  flood();
  return true;
}
/*==CORE-END==*/

const cv=document.getElementById('cv'), cx=cv.getContext('2d');
let HS=32, OX=0, OY=0, RISE=0, HOVER=-1, HEAD=-1, FOOT=-1;

/* the wall of the pot: one ring beyond the board, standing at WALL */
const RIM=[];
for(let q=-R-1;q<=R+1;q++){
  const lo=Math.max(-R-1,-q-R-1), hi=Math.min(R+1,-q+R+1);
  for(let r=lo;r<=hi;r++){
    const d=(Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2;
    if(d===R+1) RIM.push({q,r,x:Math.sqrt(3)*(q+r/2),y:1.5*r});
  }
}
const WALLTILE={h:WALL,vol:false,soil:0,life:false};
const RMAX=Math.max(...RIM.map(c=>Math.hypot(c.x,c.y)))+1;
/* height anywhere, board or wall or the void beyond it — for drawing flanks */
const hAnywhere=(q,r)=>{
  const i=at(q,r); if(i>=0) return T[i].h;
  return (Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2===R+1 ? WALL : 0;
};
/* The wall and the board are drawn in ONE north-to-south pass. Drawn as two
   passes — the whole ring first, as the sea used to be — every wall hex in
   FRONT of the board was painted under it, and the pot had no near rim. */
/* ---------------------------------------------------------------------
   ORIENTATION. A triangular lattice has six-fold symmetry, so the board can
   be turned in sixths of a turn and still be a hex board. Everything that
   has a place on screen keeps a VIEW position (vx, vy) which is its own
   position turned by ROT; nothing in the simulation moves, and no axial
   coordinate changes — only where things are drawn.

   The two flanks a hex shows are the two facing the viewer, so which AXIAL
   directions those are shifts with ROT. The corner indices do not: a hexagon
   turned by a sixth is the same hexagon, so the screen corners stay put. */
let ROT=0;
const SCENE=[];
function orient(){
  const a=Math.PI/3*ROT, ca=Math.cos(a), sa=Math.sin(a);
  const turn=o=>{ o.vx=o.x*ca-o.y*sa; o.vy=o.x*sa+o.y*ca; };
  T.forEach(turn); RIM.forEach(turn); VERT.forEach(turn);
  SCENE.length=0;
  T.forEach((t,i)=>SCENE.push({y:t.vy,i,rim:false}));
  RIM.forEach((c,i)=>SCENE.push({y:c.vy,i,rim:true}));
  SCENE.sort((a,b)=>a.y-b.y || (a.rim?1:0)-(b.rim?1:0) || a.i-b.i);
}
orient();

/* Each seam is drawn with the LOWER of the two hexes it separates, because
   that is the surface the water lies on. Owned by the more SOUTHERN hex
   instead, a seam tucked in behind a taller near neighbour got painted on
   top of that neighbour, and the river appeared to hang in the air over it.
   Owned by the lower hex, anything nearer or taller is drawn afterwards and
   covers it, which is what should happen to a river you cannot see. */
let RIVOWN=[], CONN=[], ARCTOP=[];
function prepRivers(){
  RIVOWN=T.map(()=>[]); CONN=T.map(()=>[]); ARCTOP=new Array(ARC.length).fill(0);
  const low=k=>{
    const s=ARC[k].side; let o=s[0];
    for(const i of s) if(T[i].h<T[o].h || (T[i].h===T[o].h && T[i].vy>T[o].vy)) o=i;
    return o;
  };
  for(let k=0;k<ARC.length;k++){
    if(!shown(k)) continue;
    const o=low(k); ARCTOP[k]=T[o].h; RIVOWN[o].push(k);
  }
  for(let v=0;v<VERT.length;v++){
    let lo=Infinity, hi=-Infinity, big=0, loK=-1;
    for(const k of VERT[v].arc){
      if(!shown(k)) continue;
      const h=ARCTOP[k];
      if(h<lo){ lo=h; loK=k; }
      if(h>hi) hi=h;
      if(ARC[k].flow>big) big=ARC[k].flow;
    }
    /* the fall lands on the low surface, so it belongs to that hex too */
    if(loK>=0 && hi>lo) CONN[low(loK)].push({v,lo,hi,big});
  }
}
/* A seam is drawn FLAT, at the height of the lower of the two hexes it
   separates — that is the surface the water actually lies on, hard against
   the foot of the other one's cliff. Sloping the line between the two nodes'
   own heights made rivers tilt through the air across a wall face instead of
   resting on anything.

   Where two seams of one river meet at different heights, the step between
   them is drawn as a VERTICAL thread at that corner. That is the waterfall:
   on stepped ground a descent IS a cliff, so it should fall, not lean. */
const RIVER_FADE=0.25;                  /* of RIVER_MIN — below this, nothing */
const shown=k=>ARC[k].flow>=RIVER_MIN*RIVER_FADE;
const RIVCOL='rgb(56,132,190)', FALLCOL='rgb(128,205,248)';
/* A river still gathers into view rather than snapping on at the threshold,
   but it does it by getting THINNER, not by going transparent. See-through
   water read as floating above the ground rather than lying on it. */
const thread=f=>{
  const t=Math.max(0,Math.min(1,
    (f-RIVER_MIN*RIVER_FADE)/(RIVER_MIN*(1-RIVER_FADE))));
  const grown=f>RIVER_MIN ? HS*0.026*(Math.sqrt(f)-1) : 0;
  return Math.min(HS*0.15, HS*(0.010+0.032*t)+grown);
};
function drawRivers(i){
  cx.lineCap='round';
  cx.strokeStyle=RIVCOL;
  for(const k of RIVOWN[i]){
    const A=ARC[k], a=VERT[A.a], b=VERT[A.b], y=ARCTOP[k];
    cx.lineWidth=thread(A.flow);
    cx.beginPath();
    cx.moveTo(OX+a.vx*HS, OY+a.vy*HS-y*RISE);
    cx.lineTo(OX+b.vx*HS, OY+b.vy*HS-y*RISE);
    cx.stroke();
  }
  for(const c of CONN[i]){
    const fall=(c.hi-c.lo)>=2;          /* a real cliff, not a single step */
    cx.strokeStyle = fall ? FALLCOL : RIVCOL;
    cx.lineWidth=thread(c.big)*(fall?1.4:1);
    cx.beginPath();
    cx.moveTo(OX+VERT[c.v].vx*HS, OY+VERT[c.v].vy*HS-c.hi*RISE);
    cx.lineTo(OX+VERT[c.v].vx*HS, OY+VERT[c.v].vy*HS-c.lo*RISE);
    cx.stroke();
  }
  cx.strokeStyle=RIVCOL;
}
const mix=(a,b,f)=>a.map((v,n)=>v+(b[n]-v)*f);
/* the ground: bare rock or basalt, darkened by the soil lying on it, and
   green where something is growing */
function ground(t,m){
  const k=Math.max(-H_MAX,Math.min(H_MAX,t.h))/H_MAX;
  const a  = t.vol?[60,52,55]  :[74,70,63];
  const up = t.vol?[178,166,172]:[240,221,178];
  const dn = t.vol?[17,15,18]  :[22,22,25];
  let c = k>=0 ? mix(a,up,k) : mix(a,dn,-k);
  if(t.soil>0) c=mix(c,[96,68,40],0.16+0.5*(t.soil/5));   /* loam */
  if(t.life)   c=mix(c,[86,150,70],0.78);                 /* green */
  return 'rgb('+c.map(v=>Math.round(v*(m===undefined?1:m))).join(',')+')';
}
/* The corners turn WITH the board. Turning only the centres and leaving the
   hexagons upright tiles at the six angles where the lattice repeats and
   comes apart at every angle between them. */
const vx=(px,py,s,k)=>{const a=Math.PI/180*(60*k-30)+Math.PI/3*ROT;
  return[px+s*Math.cos(a),py+s*Math.sin(a)]};
/* Which flanks a hex shows is decided PER FACE, from where that face's
   outward normal points on screen — so it is right at any angle, not only at
   the six the board started from. Halfway between two sixths a hexagon is
   flat-topped and shows ONE face, not two, and this handles that on its own.
   FACE[c] is the axial direction the face between corners c and c+1 divides;
   the light stays fixed in SCREEN space, so the board turns under it. */
const FACE=[0,5,4,3,2,1];
const LIGHT=Math.PI/3;
const faceNormal=c=>Math.PI/180*(60*c)+Math.PI/3*ROT;
const faceShade=n=>0.30+0.32*Math.cos(n-LIGHT);
function layout(){
  const w=document.getElementById('board').clientWidth||900;
  HS=w/(Math.sqrt(3)*(2*R+4.2));
  RISE=HS*0.34;
  let tall=WALL, deep=0;                       /* the wall is always standing */
  for(const t of T){ const u=surf(t);
    if(u>tall) tall=u; if(-t.h>deep) deep=-t.h; }
  HEAD=RISE*(tall?tall+1:0); FOOT=RISE*(deep?deep+1:0);
  const half=HS*(RMAX+1.2);      /* radius, so it is turn-proof */
  const h=Math.ceil(2*half+HEAD+FOOT);
  const dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
  OX=w/2; OY=HEAD+half;
}
/* MOISTURE AS A BAR. A dot per point stopped being a reading once the count
   could run to two dozen — two dozen dots on a hex is noise. The bar is a
   read-out only: it changes no rule, and the exact number is still on the
   panel. Scale is FIXED, not fitted to the board, so the same length always
   means the same damp and you can compare one board with another. It stays
   upright as the board turns, like the height numbers do. */
let SHOW_MOIST=false;
const MOIST_FULL=12;
function moistBar(px,py,s,m){
  const w=s*0.92, h=Math.max(3,s*0.15), x=px-w/2, y=py-h/2;
  cx.fillStyle='rgba(0,0,0,.42)';
  cx.fillRect(x,y,w,h);
  if(m>0){
    const f=Math.min(1,m/MOIST_FULL);
    cx.fillStyle = f>=1 ? 'rgb(158,224,255)' : 'rgb(74,158,214)';
    cx.fillRect(x,y,w*f,h);
  }
  cx.strokeStyle='rgba(0,0,0,.4)'; cx.lineWidth=1;
  cx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function face(px,py,s){
  cx.beginPath();
  for(let k=0;k<6;k++){const[X,Y]=vx(px,py,s,k);k?cx.lineTo(X,Y):cx.moveTo(X,Y)}
  cx.closePath();
}
const drawOrder=()=>T.map((t,i)=>i).sort((a,b)=>T[a].vy-T[b].vy||a-b);

function render(){
  let tall=WALL, deep=0;                       /* the wall is always standing */
  for(const t of T){ const u=surf(t);
    if(u>tall) tall=u; if(-t.h>deep) deep=-t.h; }
  if(RISE*(tall?tall+1:0)!==HEAD||RISE*(deep?deep+1:0)!==FOOT) layout();
  cx.fillStyle='#05070a'; cx.fillRect(0,0,cv.width,cv.height);
  /* Full size, so the hexes actually TILE. They used to be drawn at 0.97 of
     the spacing, which left a 1.2px channel between every pair — barely
     noticeable when the surround was flat sea, and an obvious crack once the
     rim became standing rock. The dark stroke on each hex is what separates
     them; it does not need a gap as well. */
  const s=HS;
  prepRivers();

  for(const S of SCENE){
    if(S.rim){                                 /* a hex of the pot wall */
      const c=RIM[S.i], px=OX+c.vx*HS, py=OY+c.vy*HS, top=py-WALL*RISE;
      for(let f=0;f<6;f++){
        const nrm=faceNormal(f);
        if(Math.sin(nrm)<=1e-3) continue;      /* turned away from the viewer */
        const d=DIRS[FACE[f]], nh=hAnywhere(c.q+d[0], c.r+d[1]);
        if(WALL<=nh) continue;
        const bot=py-nh*RISE;
        const [ax,ay]=vx(px,0,s,f), [bx,by]=vx(px,0,s,(f+1)%6);
        cx.fillStyle=ground(WALLTILE,faceShade(nrm));
        cx.beginPath();
        cx.moveTo(ax,ay+top); cx.lineTo(bx,by+top);
        cx.lineTo(bx,by+bot); cx.lineTo(ax,ay+bot);
        cx.closePath(); cx.fill();
      }
      cx.fillStyle=ground(WALLTILE);
      face(px,top,s); cx.fill();
      cx.strokeStyle='rgba(0,0,0,.35)'; cx.lineWidth=1;
      face(px,top,s); cx.stroke();
      continue;
    }
    const i=S.i;
    const t=T[i], px=OX+t.vx*HS, py=OY+t.vy*HS, top=py-t.h*RISE;
    /* a wall exists only where there is a real step, and it runs from this
       hex's surface to that neighbour's — never down to the datum */
    for(let f=0;f<6;f++){
      const nrm=faceNormal(f);
      if(Math.sin(nrm)<=1e-3) continue;        /* turned away from the viewer */
      const j=t.nb[FACE[f]], nh = j<0 ? WALL : T[j].h;
      if(t.h<=nh) continue;
      const bot=py-nh*RISE;
      const [ax,ay]=vx(px,0,s,f), [bx,by]=vx(px,0,s,(f+1)%6);
      cx.fillStyle=ground(t,faceShade(nrm));
      cx.beginPath();
      cx.moveTo(ax,ay+top); cx.lineTo(bx,by+top);
      cx.lineTo(bx,by+bot); cx.lineTo(ax,ay+bot);
      cx.closePath(); cx.fill();
    }
    cx.fillStyle=ground(t);
    face(px,top,s); cx.fill();
    cx.strokeStyle='rgba(0,0,0,.35)'; cx.lineWidth=1;
    face(px,top,s); cx.stroke();

    if(t.liq!==NONE){
      /* the liquid stands at the brim of its basin */
      const lava=t.liq===LAVA, wy=py-t.ls*RISE;
      for(let f=0;f<6;f++){
        if(Math.sin(faceNormal(f))<=1e-3) continue;
        const [ax,ay]=vx(px,0,s,f), [bx,by]=vx(px,0,s,(f+1)%6);
        cx.fillStyle = lava ? 'rgba(150,42,14,.9)' : 'rgba(30,86,124,.85)';
        cx.beginPath();
        cx.moveTo(ax,ay+wy); cx.lineTo(bx,by+wy);
        cx.lineTo(bx,by+top); cx.lineTo(ax,ay+top);
        cx.closePath(); cx.fill();
      }
      cx.fillStyle = lava ? 'rgba(226,88,30,.94)' : 'rgba(52,124,170,.88)';
      face(px,wy,s); cx.fill();
      cx.strokeStyle = lava ? 'rgba(255,190,90,.75)' : 'rgba(140,200,235,.4)';
      cx.lineWidth = lava?1.5:1; face(px,wy,s); cx.stroke();
      cx.fillStyle = lava ? 'rgba(60,16,6,.8)' : 'rgba(255,255,255,.72)';
      cx.font=(HS*0.40|0)+'px ui-monospace,monospace';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(t.h,px,wy+HS*0.04);
    } else {
      if(t.h!==0){
        cx.fillStyle=t.h>0?'rgba(0,0,0,.5)':'rgba(222,228,238,.72)';
        cx.font=(HS*0.42|0)+'px ui-monospace,monospace';
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.fillText(t.h,px,top+HS*0.04);
      }
      /* the two auras: a dot for each neighbour that is water, or lava.
         Nothing to add up — they are counts, not quantities. */
      const dots=(n,col,dy)=>{
        if(!n) return;
        cx.fillStyle=col;
        const w0=(n-1)*s*0.19/2;
        for(let k=0;k<n;k++){
          cx.beginPath(); cx.arc(px-w0+k*s*0.19, top+dy, s*0.068, 0, 7); cx.fill();
        }
      };
      if(SHOW_MOIST) moistBar(px, top+s*0.44, s, t.moist);
      else dots(t.moist,'rgba(90,175,225,.9)', s*0.46);
      dots(t.temp ,'rgba(240,130,50,.95)',-s*0.46);
    }
    drawRivers(i);          /* the seams this hex owns, on top of its own face */
  }

  /* The hover marks go in a pass of their OWN, after every hex is down.
     Drawn inside the loop they were painted over by whatever lies to the
     south, so a deluge showed four of its seven hexes instead of all of them. */
  if(HOVER>=0){
    const t=T[HOVER];
    const ring=j=>{ const u=T[j];
      face(OX+u.vx*HS, OY+u.vy*HS-surf(u)*RISE, s*0.90); cx.stroke(); };
    cx.strokeStyle = POWER.k==='deluge' ? '#5aafe1'
                   : POWER.k==='lava'   ? '#e0793c'
                   : POWER.k==='seed'   ? '#7fd06a'
                   : POWER.d>0 ? '#fff' : '#c9a86a';
    if(POWER.k==='seed'){
      /* the whole patch this seed would green */
      const cells=patchAt(HOVER);
      cx.lineWidth=Math.max(1.3,HS*0.06);
      if(cells) for(const j of cells) if(!T[j].life) ring(j);
    } else if(POWER.d===0){
      /* the whole basin this click would act on, so you can see whether you
         are aiming at a basin at all before you spend it */
      const b=basinAt(HOVER);
      cx.lineWidth=Math.max(1.3,HS*0.06);
      if(b) for(const j of b.cells)
        if(POWER.k==='lava' || T[j].liq!==WATER) ring(j);
    }
    cx.lineWidth=Math.max(1.8,HS*0.1);
    face(OX+t.vx*HS, OY+t.vy*HS-surf(t)*RISE, s); cx.stroke();
  }
}
function inHex(mx,my,px,py,s){
  /* the hexagon turns with the board, so un-turn the point before testing */
  const a=-Math.PI/3*ROT, ca=Math.cos(a), sa=Math.sin(a);
  const ox=mx-px, oy=my-py;
  const dx=Math.abs(ox*ca-oy*sa), dy=Math.abs(ox*sa+oy*ca), w=s*Math.sqrt(3)/2;
  return dx<=w && dy <= s - (dx/w)*(s/2);
}
function hexAt(mx,my){
  const o=drawOrder();
  for(let n=o.length-1;n>=0;n--){
    const t=T[o[n]], px=OX+t.vx*HS, py=OY+t.vy*HS - surf(t)*RISE;
    if(inHex(mx,my,px,py,HS)) return o[n];   /* pick the whole hex, not 97% */
  }
  return -1;
}
/* what the hex under the cursor actually is */
function drawInfo(){
  const el=document.getElementById('info');
  if(HOVER<0){
    el.innerHTML='<h4>hex</h4><span class="none">hover the board</span>';
    return;
  }
  const t=T[HOVER];
  const row=(k,v,cls)=>'<div class="r'+(cls==='q'?' q':'')+'"><span>'+k+
    '</span><span'+(cls&&cls!=='q'?' class="'+cls+'"':'')+'>'+v+'</span></div>';
  const b=basinAt(HOVER);
  let h='<h4>'+t.q+', '+t.r+'</h4>';
  h+=row('ground', t.h + (t.vol?'  basalt':'  rock'), t.vol?'v':'');
  h+=row('relief', t.rel);
  h+= t.liq===WATER ? row('water','surface '+t.ls,'w')
    : t.liq===LAVA  ? row('lava','surface '+t.ls,'l')
    : row('basin', b ? 'fills to '+b.level : '—', b?'':'q');
  h+=row('moisture', t.moist||'—', t.moist?'w':'q');
  h+=row('heat',     t.temp ||'—', t.temp ?'l':'q');
  h+=row('river',    t.river>0 ? t.river.toFixed(1)
                   : t.disc>0 ? 'a trickle' : '—', t.river>0?'w':'q');
  h+=row('soil',     t.soil>0 ? t.soil.toFixed(2) : '—', t.soil>0?'s':'q');
  h+=row('life',     t.life ? 'growing' : (habit(t)?'could grow':'—'),
         t.life?'g':'q');
  el.innerHTML=h;
}
function drawMenu(){
  document.getElementById('powers').innerHTML=POWERS.map(p=>
    '<button class="pw'+(p.k===POWER.k?' on':'')+'" data-k="'+p.k+'">'+
    p.ic+'<span>'+p.nm+'</span></button>').join('');
  /* ONLY the power buttons — the View panel uses the same .pw styling, and
     an unscoped query stole its clicks and set POWER to undefined */
  document.querySelectorAll('#powers .pw').forEach(b=>b.onclick=()=>{
    POWER=POWERS.find(p=>p.k===b.dataset.k); drawMenu(); render(); drawInfo();
  });
}
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  const i=hexAt(e.clientX-r.left,e.clientY-r.top);
  if(i!==HOVER){ HOVER=i; render(); drawInfo(); }
});
cv.addEventListener('mouseleave',()=>{HOVER=-1;render();drawInfo()});
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const i=hexAt(e.clientX-r.left,e.clientY-r.top);
  if(use(i,POWER)){ render(); drawInfo(); }
});
/* Turning changes nothing but the view, so the board is never re-solved —
   it is safe to do sixty times a second. ROT is a REAL number while a turn
   is running; everything that reads it was generalised to cope, so the board
   is a proper hex board at every angle in between and not only at the six
   where the lattice repeats.

   Presses queue rather than fight: each one adds a sixth to wherever the
   turn was already heading, so holding the key spins smoothly. */
let rotTo=0, rotFrom=0, rotAt=0, spinning=false;
const SPIN=280;
function step(now){
  let u=(now-rotAt)/SPIN;
  if(u>1) u=1;
  const e=u<0.5 ? 2*u*u : 1-Math.pow(2-2*u,2)/2;      /* ease in, ease out */
  ROT=rotFrom+(rotTo-rotFrom)*e;
  orient(); render();
  if(u<1) requestAnimationFrame(step);
  else{
    spinning=false;
    ROT=rotTo=((rotTo%6)+6)%6;                        /* keep the numbers small */
    rotFrom=ROT; orient(); render(); drawInfo();
  }
}
function turn(n){
  rotFrom=ROT; rotTo=Math.round(rotTo)+n; rotAt=performance.now();
  if(!spinning){ spinning=true; requestAnimationFrame(step); }
}
document.getElementById('rotL').onclick=()=>turn(-1);
document.getElementById('rotR').onclick=()=>turn(1);
const ovMoist=document.getElementById('ovMoist');
ovMoist.onclick=()=>{
  SHOW_MOIST=!SHOW_MOIST;
  ovMoist.classList.toggle('on',SHOW_MOIST);
  render();                       /* a read-out: nothing is re-solved */
};
window.addEventListener('keydown',e=>{
  if(e.key==='['||e.key==='q'||e.key==='Q') turn(-1);
  else if(e.key===']'||e.key==='e'||e.key==='E') turn(1);
});
window.addEventListener('resize',()=>{layout();render()});
drawMenu(); layout(); flood(); render(); drawInfo();
</script>
</body>
