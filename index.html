<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uplift</title>
<style>
  html,body{margin:0;min-height:100%;background:#08090c}
  body{color:#8b929c;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:13px;font-weight:400;letter-spacing:4px;text-transform:uppercase;
    color:#c9a86a;margin:0 0 12px}
  .main{display:grid;grid-template-columns:1fr 176px;gap:14px;align-items:start}
  @media(max-width:780px){.main{grid-template-columns:1fr}}
  #board{background:#05070a;border:1px solid #1d222a;position:relative;
    height:660px;overflow:hidden}
  #board canvas{display:block;width:100%;height:100%;cursor:crosshair;
    touch-action:none}
  #info{position:absolute;left:10px;top:10px;width:184px;pointer-events:none;
    background:rgba(10,12,16,.92);border:1px solid #1d222a;font-size:11px;
    line-height:1.55;padding:8px 10px;z-index:2}
  #info h4{margin:0 0 5px;font-size:8.5px;font-weight:400;letter-spacing:1.8px;
    text-transform:uppercase;color:#464e58}
  #info .r{display:flex;justify-content:space-between;gap:8px}
  #info .r span:first-child{color:#5c646e}
  #info .r span:last-child{color:#c3cad3;font-variant-numeric:tabular-nums}
  #info .r.q span:last-child{color:#6f7681}
  #info .none{color:#464e58}
  #info .w{color:#6fb6e8} #info .l{color:#e8853c}
  #info .g{color:#82c46a} #info .s{color:#c39a5e} #info .v{color:#a99aa8}
  .hint{padding:8px 2px 0;letter-spacing:.5px;color:#464e58}
  .hint b{color:#8b929c;font-weight:400}

  .menu{border:1px solid #1d222a;background:#0e1116}
  .menu h2{margin:0;padding:9px 11px;font-size:9px;font-weight:400;letter-spacing:2px;
    text-transform:uppercase;color:#464e58;border-bottom:1px solid #1d222a}
  .pw{display:flex;align-items:center;gap:10px;width:100%;padding:11px;
    border-bottom:1px solid #12161c;border-left:2px solid transparent;
    background:none;color:#8b929c;font-family:inherit;font-size:12px;
    letter-spacing:1px;cursor:pointer;text-align:left}
  .pw:last-child{border-bottom:none}
  .pw:hover{background:#12151b}
  .pw svg{width:18px;height:18px;flex:0 0 18px;stroke:#6f7681;fill:none;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .pw.on{border-left-color:#c9a86a;color:#e5dcc8;background:#171510}
  .pw.on svg{stroke:#c9a86a}
  .rates{display:flex;border-top:1px solid #12161c}
  .rt{flex:1;padding:7px 0;background:none;border:0;border-right:1px solid #12161c;
    color:#6f7681;font-family:inherit;font-size:11px;letter-spacing:.5px;cursor:pointer}
  .rt:last-child{border-right:none}
  .rt:hover{background:#12151b}
  .rt.on{color:#c9a86a;background:#171510}
</style>

<div class="wrap">
  <h1>Uplift</h1>
  <div class="main">
    <div>
      <div id="board"><div id="info"></div></div>
      <div class="hint"><b>click a hex</b> — drag to orbit, scroll to zoom.
        A rain tile drops 70 units a tick — one water tile — and 420 units
        make one step of stone. Water levels itself with whatever is lower.</div>
    </div>
    <div>
      <div class="menu">
        <h2>Powers</h2>
        <div id="powers"></div>
        <div class="rates" id="brush"></div>
      </div>
      <div class="menu" style="margin-top:14px">
        <h2>View</h2>
        <button class="pw" id="ovProj"><svg viewBox="0 0 18 18">
          <path d="M9 1.5 16 5.5v7L9 16.5 2 12.5v-7z"/><path d="M9 8.5 16 5.5"/>
          <path d="M9 8.5 2 5.5"/><path d="M9 8.5v8"/></svg>
          <span>Flat view</span></button>
        <button class="pw on" id="ovBand"><svg viewBox="0 0 18 18">
          <path d="M2 5.5h14M2 9h14M2 12.5h14"/></svg>
          <span>Contours</span></button>
        <button class="pw on" id="ovRiver"><svg viewBox="0 0 18 18">
          <path d="M3 13c3-1 3-4 6-5s3-4 6-5"/></svg>
          <span>Rivers</span></button>
        <button class="pw" id="ovDrain"><svg viewBox="0 0 18 18">
          <path d="M3 3v4l6 4v4"/><path d="M15 3v4l-6 4"/></svg>
          <span>Drainage</span></button>
        <div class="rates" id="sun"></div>
      </div>
      <div class="menu" style="margin-top:14px">
        <h2>Time</h2>
        <button class="pw" id="stepBtn"><svg viewBox="0 0 18 18">
          <circle cx="9" cy="9" r="7"/><path d="M9 4.3V9l3.2 2.1"/></svg>
          <span>Pass time</span></button>
        <button class="pw" id="playBtn"><svg viewBox="0 0 18 18">
          <path d="M6 4l8 5-8 5z"/></svg>
          <span>Play</span></button>
        <div class="rates" id="rates"></div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/addons/controls/OrbitControls.js';

/*==CORE-START==*/
/* ======================================================================
   A disc of hexes floating in space. Three powers: raise a column, lower a
   column, hang a cloud over it.

   STORED per hex:  h     ground height, in whole steps
                    pool  how much water is standing on it

   DERIVED          flow  how much water CROSSED it this tick, which is a
                          different number from how much stands on it, and
                          the one erosion will want

   That is the whole state. Soil, life, moisture, heat, relief, lava and
   the endless-source liquids are all GONE while the water is built, so
   that what you are watching is the water and nothing else.

   THE EDGE IS THE VOID. There was a sea here once, then a wall standing at
   5 that replaced it. The wall stood ABOVE the floor, which made the whole
   board one basin: one pour drowned all 127 hexes and nothing could ever
   drain. Now anything that reaches an edge goes over it, which gives the
   outlet back and deletes that whole class of problem at once.
   ====================================================================== */
const R=12, H_MAX=12;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];   /* E NE NW W SW SE */
/* the same six as unit vectors in world units, for reading the per-edge
   flow as a bearing. Off-board edges have a direction too, which is why
   this is here and not derived from neighbour positions. */
const DIRV=DIRS.map(d=>{
  const x=Math.sqrt(3)*(d[0]+d[1]/2), y=1.5*d[1], L=Math.hypot(x,y);
  return [x/L,y/L];
});

const T=[], idx=new Map();
for(let q=-R;q<=R;q++){
  const lo=Math.max(-R,-q-R), hi=Math.min(R,-q+R);
  for(let r=lo;r<=hi;r++){
    idx.set(q+','+r,T.length);
    T.push({q,r,x:Math.sqrt(3)*(q+r/2),y:1.5*r,pool:0,flow:0,out:new Float64Array(6)});
  }
}

/* ---------------------------------------------------------------------
   THE STACK.

   A column is no longer one number. It is a run of CELLS, one per level,
   each of them air or rock or basalt. `h` and `vol` are now ACCESSORS over
   that stack: every rule that read a height still reads a height, every rule
   that wrote one still writes one, and none of them know anything changed.
   The encoding moved; the interface did not.

   That is the whole of this step, deliberately. Caves and overhangs are
   impossible with one height per column — but they are also impossible to
   check against what came before, so the storage changes here and NOTHING
   else, verified by running the same boards through both and diffing.

   Cell z occupies the slab from height Z0+z to Z0+z+1, so a column whose
   highest solid cell is z has its surface at Z0+z+1. TOP caches that
   highest cell: h is read constantly, in every inner loop of soils() and
   fillFrom(), and rescanning 32 cells each time was not affordable.
   --------------------------------------------------------------------- */
const ZN=32, Z0=-13;
const AIR=0, ROCK=1, BASALT=2, CLOUD=3;
const CELL=new Uint8Array(T.length*ZN);
const TOP=new Int8Array(T.length).fill(-1);
const cell=(i,z)=>(z<0||z>=ZN)?AIR:CELL[i*ZN+z];
/* after any direct edit to the cells, the cached surface has to be found again */
function retop(i){
  const b=i*ZN;
  let z=ZN-1;
  while(z>=0 && (!CELL[b+z] || CELL[b+z]===CLOUD)) z--;
  TOP[i]=z;
  return z;
}
/* fill a column solid up to this surface height, keeping the material it
   already had and clearing everything above */
function setTop(i,h){
  const b=i*ZN, t=Math.max(-1,Math.min(ZN-1,h-Z0-1));
  const m=(TOP[i]>=0 && CELL[b+TOP[i]]) || ROCK;
  for(let z=0;z<ZN;z++)
    if(CELL[b+z]!==CLOUD) CELL[b+z] = z<=t ? (CELL[b+z]||m) : AIR;
  TOP[i]=t;
}
for(let i=0;i<T.length;i++){
  Object.defineProperty(T[i],'h',{
    get(){ return Z0+TOP[i]+1; },
    set(v){ setTop(i,v); },
    enumerable:true});
  Object.defineProperty(T[i],'vol',{
    get(){ return TOP[i]>=0 && CELL[i*ZN+TOP[i]]===BASALT; },
    /* per-hex today, so setting it converts the whole column — the same
       information the old boolean carried, held one level down */
    set(v){ const b=i*ZN, m=v?BASALT:ROCK;
      for(let z=0;z<ZN;z++) if(CELL[b+z] && CELL[b+z]!==CLOUD) CELL[b+z]=m; },
    enumerable:true});
  setTop(i,0);
}
for(const t of T) t.nb=DIRS.map(d=>{
  const j=idx.get((t.q+d[0])+','+(t.r+d[1])); return j===undefined?-1:j});
/* the ring at distance TWO */
const RING2=[];
for(let dq=-2;dq<=2;dq++) for(let dr=-2;dr<=2;dr++)
  if((Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2===2) RING2.push([dq,dr]);
for(const t of T) t.nb2=RING2.map(d=>{
  const j=idx.get((t.q+d[0])+','+(t.r+d[1])); return j===undefined?-1:j});
for(const t of T) t.coast=t.nb.filter(j=>j<0).length;
const at=(q,r)=>{const i=idx.get(q+','+r);return i===undefined?-1:i};
/* ---------------------------------------------------------------------
   WATER, AND NOTHING ELSE. Five rules, and no sixth.

     1  a rain tile drops 70 units on the column below it, every tick
     2  one elevation step is 420 units; one water tile is 70 of them
     3  a tile's HEIGHT is stone plus the water standing on it
     4  a tile with water hands its WHOLE contents to whichever neighbours
        stand lower, split equally between them
     5  off the board is lower than anything, and that share is gone

   Water is an AMOUNT and it is conserved except over the edge. Layers are
   a DISPLAY quantum only: a tile shows floor(water/12) water tiles stacked
   on it, so anything under 12 is held but not drawn, and a tile can carry
   20 units and show one.
   --------------------------------------------------------------------- */
/* 420 UNITS TO AN ELEVATION STEP, and 70 of them to a water tile. The number
   is the lowest common multiple of 2 through 7, and a tile shares what it
   sheds between itself and up to six lower neighbours -- so every FIRST
   split lands on a whole number whatever the neighbour count. It stops
   being exact at the second division, so water is still a float; 420 only
   makes the readings you actually look at legible. 72 units read 1.714
   where 420 reads 10. */
const LAYER=1/6;
const RAINFALL=LAYER;            /* what one rain tile drops each tick */
const CLOUD_Z=ZN-5;              /* rain tiles ride up here, clear of the ground */

/* ---------------------------------------------------------------------
   SETTLE - one step, and exactly those rules.

   Every tile holding water reads its six neighbours by NET ELEVATION,
   stone plus whatever water stands on it, and pours into the ones standing
   lower until THEY ARE ALL AT ONE HEIGHT WITH IT. A tile with nothing lower
   beside it keeps what it has.

   The level is found by walking the neighbours from the lowest upward, each
   one joining the pour as the surface drops past it:

       what the tile gives up  =  what the neighbours below L take in
             H - L             =  sum over aj < L of (L - aj)

   With the first m+1 neighbours taking part that is L = (H + Sm) / (m + 2),
   and the walk stops at the first m where L actually lands between that
   neighbour and the next. Because everyone finishes at the same height,
   nothing can overshoot anything.

   THIS REPLACED levelling with only the HIGHEST lower neighbour and then
   splitting that amount equally, which is the same answer whenever the
   lower neighbours are all at one height and wrong whenever they are not.
   A tile beside three neighbours at its own height and two a full two
   elevations down stopped shedding the moment it matched the near ones, so
   a block of water sat there handing out equal dribbles instead of pouring
   over the drop.

   A tile cannot give more than it has. If the level would take it below its
   own stone it empties instead, and the receivers level among themselves
   with what there was.

   THE WHOLE BOARD IS READ FROM ONE SNAPSHOT and written afterwards, so no
   tile can see another tile's move inside the same tick. Taken in place,
   the answer would depend on the order the tiles were visited, and a
   symmetric board would shed lopsidedly.

   A TICK IS ONE STEP, not a solve. Water moves one hex per tick and no
   further, so a basin far from the rain fills slowly as the water walks to
   it.
   --------------------------------------------------------------------- */
function settle(){
  const n=T.length;
  const was=T.map(t=>t.pool);
  const top=i=>T[i].h+was[i];
  const add=new Array(n).fill(0);
  /* THROUGHPUT: what CROSSES a tile, as against what stands on it. The two
     are different numbers and nothing else here can tell them apart -- the
     tile under a rain cloud holds nothing and passes seventy units a tick,
     while a full lake holds five thousand and passes none. `pool` calls
     both of them wet.

     It is what erosion will want: erosion is throughput times drop, so
     moving water cuts and standing water does not. Weathering driven by
     nearby standing water instead is what once had a rain cloud over a
     rocky basin manufacture five soil out of a lake that was going nowhere.
     It is also what a river actually is -- not a wet tile, since a lake is
     wet, and not a sloped tile, since a dry cliff has slope.

     Kept as SIX PER-EDGE AMOUNTS rather than one scalar, because
     summarising at capture time is the mistake that would need undoing. The
     throughput is their sum; the bearing and how focused the flow is are
     their vector sum; and a FORK survives, which a vector sum destroys --
     water splitting to two opposite sides cancels to nothing and reads
     exactly like a sheet spreading in all directions. Take what settle
     knows before the tick ends, in the form it knows it.

     DERIVED, never stored: recomputed from the same state every tick, and
     zero on a board at rest. A smoothed or running value would be stored
     state, which is the thing this project has been burnt by more than any
     other -- keep it instantaneous and let the renderer do any smoothing. */
  for(const t of T){ t.flow=0; t.out.fill(0); }

  /* the level at which vol, poured onto these heights, comes to rest --
     with base counted in as one more place for it to stand */
  const levelOf=(hs,vol,base)=>{
    let S=0, L=null;
    for(let m=0;m<hs.length;m++){
      S+=hs[m];
      const cand=(vol+S)/(m+1+base);
      if(cand>hs[m]+1e-15 && (m===hs.length-1 || cand<=hs[m+1]+1e-12)){ L=cand; break; }
    }
    return L===null ? (vol+S)/(hs.length+base) : L;
  };

  for(let i=0;i<n;i++){
    const w=was[i];
    if(w<=1e-12) continue;
    const H=top(i);
    /* low holds EDGE SLOTS, not hex numbers, so what goes where can be
       written back against the edge it went through */
    const low=[]; let off=0;
    for(let k=0;k<6;k++){
      const j=T[i].nb[k];
      if(j<0){ off++; continue; }                /* the void */
      if(top(j)<H-1e-12) low.push(k);
    }
    /* off the board is lower than anything, so under levelling it takes the
       lot and none of it comes back. That is rule 5. Shared equally between
       however many edges face out. */
    if(off){
      add[i]-=w; T[i].flow=w;
      const each=w/off;
      for(let k=0;k<6;k++) if(T[i].nb[k]<0) T[i].out[k]=each;
      continue;
    }
    if(!low.length) continue;                    /* nothing lower: it stays */

    low.sort((a,b)=>top(T[i].nb[a])-top(T[i].nb[b]));
    const hs=low.map(k=>top(T[i].nb[k]));
    /* base 1: the tile itself is one of the places the water comes to rest */
    let L=levelOf(hs,H,1);
    if(H-L>w) L=levelOf(hs,w,0);                 /* it empties instead */

    let sum=0;
    for(let k=0;k<low.length;k++){
      const d=L-hs[k];
      if(d>0){ const e=low[k]; add[T[i].nb[e]]+=d; sum+=d; T[i].out[e]=d; }
    }
    add[i]-=sum; T[i].flow=sum;                  /* exactly what left it */
  }
  for(let i=0;i<n;i++) T[i].pool=Math.max(0,was[i]+add[i]);
}
/* the rain tiles rain, and then everything sheds once */
function tick(){
  for(let i=0;i<T.length;i++)
    if(CELL[i*ZN+CLOUD_Z]===CLOUD) T[i].pool+=RAINFALL;
  settle();
}

const legal=(i,p)=> p.d===0 ? true
                  : p.d>0 ? T[i].h<H_MAX : T[i].h>-H_MAX;

/* every hex within rad of i, rad 0 being the hex itself */
function within(i,rad){
  const out=[], t=T[i];
  for(let dq=-rad;dq<=rad;dq++) for(let dr=-rad;dr<=rad;dr++){
    if((Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2>rad) continue;
    const j=at(t.q+dq,t.r+dr);
    if(j>=0) out.push(j);
  }
  return out;
}

/* THE BRUSH IS IN THE CORE, not in the UI, because a click has to stay ONE
   TICK however many hexes it moves. Applying use() per hex would run the
   weather 37 times for one press of a radius-3 brush. */
function use(i,p,rad){
  if(i==null||i<0||!T[i]) return false;
  const cells=within(i,rad||0);
  if(p.k==='cloud'){
    /* the centre decides for the whole brush, so a stroke is all-on or
       all-off rather than a checkerboard of toggles */
    const on = cell(i,CLOUD_Z)!==CLOUD;
    for(const j of cells) CELL[j*ZN+CLOUD_Z] = on?CLOUD:AIR;
  } else {
    const move=cells.filter(j=>legal(j,p));
    if(!move.length) return false;         /* every hex already at the limit */
    for(const j of move) T[j].h+=p.d;
  }
  tick();                       /* every action is a tick: the weather runs */
  return true;
}
/*==CORE-END==*/

/* ======================================================================
   THREE.JS RENDERER

   Everything above CORE-END is the simulation and knows nothing about this.
   That split is why the renderer could be swapped out from under it without
   touching a rule, and why `node test/rules.test.js` still runs with no
   server and no three.js at all — it reads the CORE block out of this file
   and evaluates it on its own.

   The board is drawn as ONE instanced mesh of hexagonal prisms: a unit prism
   scaled in Y per column. CylinderGeometry with six radial segments IS a hex
   prism, and its first vertex sits on +Z, which is pointy-top in the axial
   layout we already use — so nothing needs rotating to line it up.

   The camera replaces the whole hand-rolled view layer. The painter's sort,
   the per-face visibility test, the light fixed in screen space, the
   sixth-of-a-turn spin and the hand-written point-in-hex test are all gone,
   and orbit, zoom and true isometric come free.
   ====================================================================== */
const RISE=0.34;                 /* one height step, in hex radii */
/* the board's half-width in world units is sqrt(3)*R, plus a margin. Declared
   up here because the shadow camera is sized from it, and that is set up with
   the lights, well before the camera itself. */
const SPAN=Math.sqrt(3)*R+4;
const BASE=-H_MAX-1;             /* every column is solid rock down to here */

/* the powers menu — the five things a click can be */
const POWERS=[
  {k:'uplift',  nm:'Uplift',  d: 1, ic:'<svg viewBox="0 0 18 18"><path d="M9 3l5 6H4z"/></svg>'},
  {k:'subduct', nm:'Subduct', d:-1, ic:'<svg viewBox="0 0 18 18"><path d="M9 15L4 9h10z"/></svg>'},
  {k:'cloud',   nm:'Cloud',   d: 0, ic:'<svg viewBox="0 0 18 18"><ellipse cx="9" cy="8" rx="6" ry="3.4"/></svg>'},
];
let POWER=POWERS[0];

/* BRUSH n covers radius n-1: 1, 7, 19 and 37 hexes. Size 2 is the one-hex
   radius; size 4 is the three-hex radius. */
let BRUSH=1;
function drawBrush(){
  document.getElementById('brush').innerHTML=[1,2,3,4].map(b=>
    '<button class="rt'+(b===BRUSH?' on':'')+'" data-b="'+b+'">'+b+'</button>').join('');
  document.querySelectorAll('#brush .rt').forEach(el=>el.onclick=()=>{
    BRUSH=+el.dataset.b; drawBrush(); hover(HOVER); });
}

const board=document.getElementById('board');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
board.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070a);
/* A HEMISPHERE rather than flat ambient. Ambient gives every shadowed flank
   the same muddy value; a hemisphere hands the six side faces six different
   ones by which way they point, which is most of what makes a hex prism
   read as a solid. Sky above, bounced ground below. */
scene.add(new THREE.HemisphereLight(0xdfe9f5,0x585d64,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.75);
scene.add(sun); scene.add(sun.target);

/* SHADOWS, because they are the only cue that carries height ACROSS
   DISTANCE. Contour banding and the occlusion both read a hex against its
   own six neighbours; neither can tell you that a peak on one side of the
   board is taller than a plateau on the other. A ridge throwing a shadow
   over the plain beside it says so at once. */
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
{ const c=sun.shadow.camera, W=SPAN*1.35;   /* the board's footprint seen
     from an oblique light is wider than the board itself */
  c.left=-W; c.right=W; c.top=W; c.bottom=-W; c.near=5; c.far=140;
  c.updateProjectionMatrix(); }
/* bias against the hex tops shadowing themselves: normalBias pushes the
   lookup along the surface normal, which is what flat faces need */
sun.shadow.bias=-0.0004;
sun.shadow.normalBias=0.08;

/* A FIXED SUN, moved by hand and never by the clock. Tying it to ticks
   would mean the same stored board renders differently depending on how
   long you had been running, so two screenshots of the same state could no
   longer be compared -- and Play at a hundred ticks a second would strobe.
   This is a VIEWING control: turn the light when a piece of ground reads
   badly. */
const SUNDIRS=[[-0.5,1,0.62],[0.5,1,0.62],[0.5,1,-0.62],[-0.5,1,-0.62]];
const SUNNAMES=['NW','NE','SE','SW'];
let SUNAT=0;
function setSun(k){
  SUNAT=k; const d=SUNDIRS[k];
  sun.position.set(d[0]*44,d[1]*44,d[2]*44);
  sun.target.position.set(0,0,0); sun.target.updateMatrixWorld();
  drawSun();
}
function drawSun(){
  document.getElementById('sun').innerHTML=SUNNAMES.map((n,k)=>
    '<button class="rt'+(k===SUNAT?' on':'')+'" data-k="'+k+'">'+n+'</button>').join('');
  document.querySelectorAll('#sun .rt').forEach(b=>b.onclick=()=>setSun(+b.dataset.k));
}
const fillLight=new THREE.DirectionalLight(0x9ab6d8,0.35);
fillLight.position.set(9,6,-8);
scene.add(fillLight);

/* Orthographic reads as isometric, which is the look this board wants.
   Perspective is there for when you want to feel the depth. */
let ortho=true, cam=null, controls=null;
function makeCam(){
  const w=board.clientWidth||900, h=board.clientHeight||660, a=w/h;
  const was=cam;
  cam = ortho ? new THREE.OrthographicCamera(-SPAN*a,SPAN*a,SPAN,-SPAN,0.1,300)
              : new THREE.PerspectiveCamera(38,a,0.1,300);
  cam.position.copy(was?was.position:new THREE.Vector3(0,SPAN*1.6,SPAN*1.9));
  if(controls){ controls.object=cam; controls.update(); }
  return cam;
}
cam=makeCam();
controls=new OrbitControls(cam,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minPolarAngle=0.15; controls.maxPolarAngle=Math.PI/2-0.05;
controls.update();

/* ---- the ground: one instance per board hex, then one per wall hex ---- */
const prism=new THREE.CylinderGeometry(1,1,1,6);
/* One prism per solid RUN, not per column. Every column is a single run
   today so this draws exactly what it drew before — but a carved column has
   several, and the count has to be able to grow. Worst case is alternating
   cells, so half a stack per column. */
const MAXRUN=T.length*Math.ceil(ZN/2);
const instHex=new Int16Array(MAXRUN).fill(-1);
const ground=new THREE.InstancedMesh(
  prism, new THREE.MeshLambertMaterial(), MAXRUN);
ground.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
ground.castShadow=true; ground.receiveShadow=true;
scene.add(ground);

/* water gets its own mesh, and sees through */
const water=new THREE.InstancedMesh(prism,
  new THREE.MeshLambertMaterial({color:0x3c86b4,transparent:true,opacity:0.72}),
  T.length);
const cloudMesh=new THREE.InstancedMesh(prism,
  new THREE.MeshLambertMaterial({color:0xc8d4e0,transparent:true,opacity:0.5}),
  T.length);
cloudMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(cloudMesh);
water.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
/* water RECEIVES but does not CAST: a shadow map has no idea it is
   see-through, so a lake would lay a solid black slab on its own bed */
water.receiveShadow=true;
scene.add(water);

/* ---------------------------------------------------------------------
   RIVERS, drawn from what the water actually did.

   One stub per EDGE that carried water: a flat ribbon from the hex centre
   out to that edge's midpoint, as wide as the flow through it. Adjacent
   tiles meet at the shared midpoint, so a channel joins up into a line
   without anything being inferred, a confluence draws itself, and a fork
   draws two branches because the tile really did send water two ways.

   THE THRESHOLD IS PER EDGE, not per tile, and that is what stops the
   spider web that killed the last two attempts at this. A sheet of water
   spreading over a plain carries as much per tick as a river does -- 73
   units against 70 -- but it leaves through all six edges at a twelfth
   each, so no edge clears the bar. A river puts all 70 through one.

   Drawn FLAT and at the height of the water already showing on the tile,
   never sloped between heights and never faded out. Sloping them looked
   wrong the first time this was tried, and fading them made the water look
   like it was floating in the air. Width carries the magnitude instead. */
const RIVER_MIN=LAYER/2;         /* half a water tile through one edge */
const MAXSTUB=T.length*6;
const stubGeo=new THREE.PlaneGeometry(1,1); stubGeo.rotateX(-Math.PI/2);
const rivers=new THREE.InstancedMesh(stubGeo,
  new THREE.MeshLambertMaterial({color:0x74c4ea,transparent:true,opacity:0.95}),
  MAXSTUB);
rivers.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
rivers.receiveShadow=true;
scene.add(rivers);
let RIVERS=true;
const stubQ=new THREE.Quaternion(), stubAx=new THREE.Vector3(0,1,0);
function stub(n,t,k,d,y){
  const v=DIRV[k], ang=Math.atan2(-v[1],v[0]);
  /* WIDTH TAPERS FROM NOTHING at the threshold. A fixed minimum width drew
     every marginal trickle as a chunky dash, and a board full of dashes
     going nowhere is the spider web that killed the last two attempts. A
     hairline says "a little water went this way" without claiming to be a
     river. Width, never opacity: fading them made the water look like it
     was floating in the air. */
  const wide=0.025+0.44*Math.min(1,(d-RIVER_MIN)/(3*LAYER));
  P.set(t.x+v[0]*0.433, y, t.y+v[1]*0.433);
  S.set(0.90,1,wide);
  stubQ.setFromAxisAngle(stubAx,ang);
  rivers.setMatrixAt(n,M4.compose(P,stubQ,S));
}

/* Hex boundaries. Level ground is one smooth plane without them and the grid
   simply is not visible — the flat renderer got this from a stroke per hex.
   All of them live in ONE LineSegments, so it stays a single draw call. */
const COS=[], SIN=[];
for(let k=0;k<6;k++){ const a=k/6*Math.PI*2; SIN.push(Math.sin(a)); COS.push(Math.cos(a)); }
const edgePos=new Float32Array(MAXRUN*6*2*3);
const edgeGeo=new THREE.BufferGeometry();
edgeGeo.setAttribute('position',new THREE.BufferAttribute(edgePos,3));
const edges=new THREE.LineSegments(edgeGeo,
  new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.45}));
scene.add(edges);
function rim(n,x,z,y){
  let o=n*36;
  for(let k=0;k<6;k++){
    const j=(k+1)%6;
    edgePos[o++]=x+SIN[k]; edgePos[o++]=y; edgePos[o++]=z+COS[k];
    edgePos[o++]=x+SIN[j]; edgePos[o++]=y; edgePos[o++]=z+COS[j];
  }
}

/* The hover preview: a hexagon lying just over each hex the brush covers.
   One ring per hex rather than one scaled outline, because the union of
   hexes within a radius is NOT a scaled hexagon — it is turned thirty
   degrees and its edges are stepped — and a preview that draws a shape the
   click will not make is a preview that lies. */
const ringPts=[];
for(let k=0;k<=6;k++){ const a=Math.PI/180*(60*k);
  ringPts.push(new THREE.Vector3(Math.sin(a)*1.04,0,Math.cos(a)*1.04)); }
const ringGeo=new THREE.BufferGeometry().setFromPoints(ringPts);
const ringMat=new THREE.LineBasicMaterial({color:0xffffff});
const RINGS=[];
for(let k=0;k<37;k++){                 /* 37 is the widest brush, radius 3 */
  const l=new THREE.Line(ringGeo,ringMat); l.visible=false; scene.add(l); RINGS.push(l);
}

const M4=new THREE.Matrix4(), Q=new THREE.Quaternion(),
      P=new THREE.Vector3(), S=new THREE.Vector3(), C=new THREE.Color();
function place(mesh,n,x,z,lo,hi){
  const h=Math.max(hi-lo,0.0001);
  P.set(x,(lo+hi)/2,z); S.set(1,h,1);
  mesh.setMatrixAt(n,M4.compose(P,Q,S));
}
function hide(mesh,n){
  P.set(0,-999,0); S.set(0.0001,0.0001,0.0001);
  mesh.setMatrixAt(n,M4.compose(P,Q,S));
}

let BANDS=true;                  /* contour banding, toggled from View */

/* the same colours the flat renderer used, handed over as a THREE.Color */
const blend=(a,b,f)=>a.map((v,n)=>v+(b[n]-v)*f);
/* THE TOPS CARRY THE RELIEF, because the lighting cannot: every top face on
   the board has the same normal, so a plateau at 8 and a floor at -3 catch
   exactly the same light. All of it has to come from colour.

   A plain ramp across the whole range gave one elevation step 92/24 of 255 —
   about one and a half percent — which is why picking out an exact step was
   guesswork. Two things fix it. */
/* ---------------------------------------------------------------------
   DRAINAGE — where the water WOULD go, read off the terrain alone.

   A single sweep from the highest ground down, each tile handing its
   running total to its lower neighbours in proportion to how far each one
   drops. That is flow accumulation, and it is what a valley is: the tiles a
   lot of ground drains through.

   IT SEEDS FROM THE CLOUDS when there are any, and from one unit on every
   tile when there are none. The two answer different questions -- "where
   will THIS rain end up" against "where are the valleys" -- and which one
   you want is exactly whether you have placed a cloud yet.

   That is not a nicety. Checked against where the water actually went, by
   rank correlation over the tiles not under standing water: seeded from the
   clouds it scores 0.76, and seeded uniformly while the rain fell only on
   the summit it scores 0.36. Assuming rain the board is not getting makes
   it a picture rather than a prediction.

   It touches nothing. No water, no ticks, no state — a pure read of h, so
   it answers "where should I put a cloud" BEFORE a drop has fallen, which
   is the one thing watching the simulation cannot tell you.

   Splitting between ALL lower neighbours rather than picking the steepest
   is deliberate: steepest-descent routing on a grid draws parallel stripes
   along the six axes, and it is also not what settle does. This matches the
   sim — water goes every way that is downhill.

   A tile touching the void keeps its own total and passes nothing on: off
   the board is lower than anything, so everything arriving there leaves.
   Somewhere with nothing lower at all — a pit, or flat ground — is where
   the accumulating stops, which is exactly where a lake would sit. */
function accum(){
  const n=T.length, a=new Float64Array(n);
  let clouds=0;
  for(let i=0;i<n;i++) if(cell(i,CLOUD_Z)===CLOUD){ a[i]=1; clouds++; }
  if(!clouds) a.fill(1);
  const order=T.map((t,i)=>i).sort((x,y)=>T[y].h-T[x].h);
  for(const i of order){
    let tot=0; const outs=[];
    for(let k=0;k<6;k++){
      const j=T[i].nb[k];
      if(j<0){ tot=-1; break; }                 /* the void takes the lot */
      const drop=T[i].h-T[j].h;
      if(drop>0){ outs.push(j); outs.push(drop); tot+=drop; }
    }
    if(tot<=0) continue;                        /* the void, a pit, or flat */
    for(let k=0;k<outs.length;k+=2) a[outs[k]]+=a[i]*outs[k+1]/tot;
  }
  return a;
}
let DRAIN=false, ACC=null, ACCMAX=1;

function tint(t,i){
  if(DRAIN && ACC){
    /* log scale: the interesting range runs from one tile draining itself
       to a trunk valley carrying a third of the board */
    const f=Math.log(1+ACC[i])/Math.log(1+ACCMAX);
    const g=blend([48,56,68],[86,206,255],f);
    const base=terrain(t);
    const c=blend(base,g,0.78);
    return new THREE.Color(c[0]/255,c[1]/255,c[2]/255).convertSRGBToLinear();
  }
  const c=terrain(t);
  return new THREE.Color(c[0]/255,c[1]/255,c[2]/255).convertSRGBToLinear();
}
function terrain(t){
  const f=(t.h+H_MAX)/(2*H_MAX);
  let c=blend([100,98,94],[190,186,180],f);
  /* CONTOUR BANDING: every other elevation a shade darker, the way a topo
     map does it, so a single step reads wherever it sits in the range
     instead of only near the extremes. */
  if(BANDS && ((t.h%2)+2)%2) c=blend(c,[16,18,22],0.11);
  /* OCCLUSION FROM THE SHAPE, not from the lights: how much higher ground
     stands around this hex. A neighbour three steps up counts full, one step
     up counts a third. Hollows and the insides of basins darken, ridges come
     forward, and it costs one pass over six neighbours. */
  let up=0;
  for(const j of t.nb) if(j>=0 && T[j].h>t.h) up+=Math.min(1,(T[j].h-t.h)/3);
  if(up>0) c=blend(c,[30,34,42],Math.min(0.5,0.085*up));
  return c;
}

function rebuild(){
  let n=0, ns=0;
  if(DRAIN){ ACC=accum(); ACCMAX=Math.max(1,...ACC); } else ACC=null;
  for(let i=0;i<T.length;i++){
    const t=T[i];
    /* walk the column, one prism per unbroken run of solid cells */
    let z=0;
    while(z<ZN){
      if(!cell(i,z)){ z++; continue; }
      let e=z; while(e+1<ZN && cell(i,e+1)) e++;
      place(ground,n,t.x,t.y,(Z0+z)*RISE,(Z0+e+1)*RISE);
      ground.setColorAt(n,tint(t,i));
      rim(n,t.x,t.y,(Z0+e+1)*RISE+0.004);
      instHex[n]=i; n++;
      z=e+1;
    }
    /* water draws in WHOLE LAYERS. Anything shallower than one layer is
       held but not shown — that remainder is what makes ground bloom into a
       visible layer several ticks after it first got wet, and it is what
       stops a sixth of a layer being drawn floating with nothing under it. */
    const wd = Math.floor(t.pool/LAYER+1e-9)*LAYER;
    if(wd>0) place(water,i,t.x,t.y,t.h*RISE,(t.h+wd)*RISE);
    else     hide(water,i);
    /* rivers ride on whatever surface is already showing, so they never
       hang in the air over a tile that draws no water */
    if(RIVERS){
      const y=(t.h+wd)*RISE+0.012;
      for(let k=0;k<6;k++){
        const d=t.out[k];
        if(d>=RIVER_MIN && ns<MAXSTUB) stub(ns++,t,k,d,y);
      }
    }
    if(cell(i,CLOUD_Z)===CLOUD)
      place(cloudMesh,i,t.x,t.y,CLOUD_Z*RISE+Z0*RISE,(CLOUD_Z+1)*RISE+Z0*RISE);
    else hide(cloudMesh,i);
  }
  for(let k=ns;k<MAXSTUB;k++) hide(rivers,k);
  rivers.count=ns;
  rivers.instanceMatrix.needsUpdate=true;
  rivers.computeBoundingSphere();
  for(let k=n;k<MAXRUN;k++){ hide(ground,k); rim(k,0,-999,0); }
  ground.count=n;
  ground.instanceMatrix.needsUpdate=true;
  ground.instanceColor.needsUpdate=true;
  edgeGeo.attributes.position.needsUpdate=true;
  edgeGeo.computeBoundingSphere();
  water.instanceMatrix.needsUpdate=true;
  /* An InstancedMesh measures itself ONCE, lazily, and caches it. Both liquid
     meshes were first measured while every instance was still parked out of
     sight, so they cached a zero-radius sphere and were frustum-culled from
     then on — placed correctly, updated correctly, and never drawn. Re-measure
     whenever the instances move. */
  ground.computeBoundingSphere();
  cloudMesh.instanceMatrix.needsUpdate=true;
  water.computeBoundingSphere();
  cloudMesh.computeBoundingSphere();
}

/* ---- picking: the raycaster hands back the instance, which IS the hex ---- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let HOVER=-1;
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.x=((ev.clientX-r.left)/r.width)*2-1;
  ndc.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,cam);
  let best=null, bestHex=-1;
  for(const m of [ground,water]){
    const hit=ray.intersectObject(m,false)[0];
    if(!hit) continue;
    /* ground instances are runs now, so the hex comes from a lookup; the
       liquid meshes are still one instance per hex */
    const hex = m===ground ? instHex[hit.instanceId] : hit.instanceId;
    if(hex>=0 && (!best||hit.distance<best.distance)){ best=hit; bestHex=hex; }
  }
  return bestHex;
}
function hover(i){
  HOVER=i;
  for(const l of RINGS) l.visible=false;
  if(i>=0){
    ringMat.color.set(POWER.k==='cloud'?0x5aafe1 : POWER.d>0?0xffffff : 0xc9a86a);
    within(i,BRUSH-1).forEach((j,k)=>{
      if(k>=RINGS.length) return;
      const t=T[j];
      RINGS[k].position.set(t.x,(t.h+t.pool)*RISE+0.03,t.y);
      RINGS[k].visible=true;
    });
  }
  drawInfo();
}
renderer.domElement.addEventListener('pointermove',e=>{
  const i=pick(e); if(i!==HOVER) hover(i);
});
renderer.domElement.addEventListener('pointerleave',()=>hover(-1));
/* an orbit drag ends in a click event too, so only a still pointer counts */
let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('click',e=>{
  if(!downAt) return;
  const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);
  downAt=null;
  if(moved>4) return;
  const i=pick(e);
  if(use(i,POWER,BRUSH-1)){ rebuild(); hover(i); }
});

function resize(){
  const w=board.clientWidth||900, h=board.clientHeight||660;
  renderer.setSize(w,h,false);
  const a=w/h;
  if(cam.isOrthographicCamera){
    cam.left=-SPAN*a; cam.right=SPAN*a; cam.top=SPAN; cam.bottom=-SPAN;
  } else cam.aspect=a;
  cam.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

/* ---- the side panel, unchanged: plain DOM reading the sim ---- */
function drawInfo(){
  const el=document.getElementById('info');
  if(HOVER<0){ el.innerHTML='<h4>hex</h4><span class="none">hover the board</span>'; return; }
  const t=T[HOVER];
  const row=(k,v,cls)=>'<div class="r'+(cls==='q'?' q':'')+'"><span>'+k+
    '</span><span'+(cls&&cls!=='q'?' class="'+cls+'"':'')+'>'+v+'</span></div>';
  const wet=t.pool>1e-9, U=v=>Math.round(v*420*100)/100;
  let h='<h4>'+t.q+', '+t.r+'</h4>';
  h+=row('ground', t.h+'   ('+U(t.h)+' units)');
  h+=row('water',  wet ? U(t.pool)+' units' : '—', wet?'w':'q');
  h+=row('layers', wet ? Math.floor(t.pool/LAYER+1e-9) : '—', wet?'w':'q');
  const run=t.flow>1e-12;
  h+=row('flow', run ? U(t.flow)+' units/tick' : '—', run?'w':'q');
  /* FOCUS: the length of the per-edge vector sum over the throughput. One
     means every drop went the same way — a channel. Zero means it went out
     evenly and the vectors cancelled — a sheet. It is the thing throughput
     alone cannot say: a rain tile on a plain carries almost as much as one
     in a trench, and they are 0.00 against 1.00. */
  if(run){
    let fx=0, fz=0;
    for(let k=0;k<6;k++){ const d=t.out[k];
      if(d>0){ fx+=d*DIRV[k][0]; fz+=d*DIRV[k][1]; } }
    const f=Math.hypot(fx,fz)/t.flow;
    h+=row('focus', f.toFixed(2)+(f>0.9?'  one way':f<0.25?'  spreading':''), 'w');
  } else h+=row('focus','—','q');
  /* the number that decides everything: stone plus the water on it */
  h+=row('height',  U(t.h+t.pool)+' units', wet?'w':'');
  h+=row('cloud',  cell(HOVER,CLOUD_Z)===CLOUD ? 'raining' : '—',
                   cell(HOVER,CLOUD_Z)===CLOUD?'w':'q');
  el.innerHTML=h;
}
function drawMenu(){
  document.getElementById('powers').innerHTML=POWERS.map(p=>
    '<button class="pw'+(p.k===POWER.k?' on':'')+'" data-k="'+p.k+'">'+
    p.ic+'<span>'+p.nm+'</span></button>').join('');
  /* ONLY the power buttons — the View panel shares the .pw styling, and an
     unscoped query once stole its clicks and set POWER to undefined */
  document.querySelectorAll('#powers .pw').forEach(b=>b.onclick=()=>{
    POWER=POWERS.find(p=>p.k===b.dataset.k); drawMenu(); hover(HOVER);
  });
}
/* Passing time WITHOUT acting. Every power click is already a tick — the
   weather runs while you sculpt — but watching a basin fill needed something
   to do that was not also changing the ground. */
let STEP=1;
const RATES=[1,2,5,10,100];
function drawRates(){
  document.getElementById('rates').innerHTML=RATES.map(r=>
    '<button class="rt'+(r===STEP?' on':'')+'" data-r="'+r+'">'+r+'×</button>').join('');
  document.querySelectorAll('#rates .rt').forEach(b=>b.onclick=()=>{
    STEP=+b.dataset.r; drawRates(); });
}
const advance=()=>{ for(let k=0;k<STEP;k++) tick(); rebuild(); hover(HOVER); };
document.getElementById('stepBtn').onclick=advance;

/* RUNNING. A tick every 10ms, STEP of them at a time, so the rate buttons
   drive Play as well as Pass time. Sculpting while it runs is fine — a
   power click is a tick like any other. */
let RUN=null;
const playBtn=document.getElementById('playBtn');
function setPlay(on){
  if(RUN){ clearInterval(RUN); RUN=null; }
  if(on) RUN=setInterval(advance,10);
  playBtn.classList.toggle('on',!!RUN);
  playBtn.querySelector('span').textContent = RUN?'Stop':'Play';
  playBtn.querySelector('path').setAttribute('d',
    RUN ? 'M5 4h3v10H5zM10 4h3v10h-3z' : 'M6 4l8 5-8 5z');
}
playBtn.onclick=()=>setPlay(!RUN);

const ovDrain=document.getElementById('ovDrain');
ovDrain.onclick=()=>{ DRAIN=!DRAIN; ovDrain.classList.toggle('on',DRAIN); rebuild(); };

const ovRiver=document.getElementById('ovRiver');
ovRiver.onclick=()=>{ RIVERS=!RIVERS; ovRiver.classList.toggle('on',RIVERS); rebuild(); };

const ovBand=document.getElementById('ovBand');
ovBand.onclick=()=>{ BANDS=!BANDS; ovBand.classList.toggle('on',BANDS); rebuild(); };

const ovProj=document.getElementById('ovProj');
ovProj.onclick=()=>{ ortho=!ortho;
  ovProj.classList.toggle('on',!ortho);
  ovProj.querySelector('span').textContent = ortho?'Flat view':'Deep view';
  cam=makeCam(); resize(); };

/* A module's scope is private, so nothing here is reachable from devtools.
   Being able to poke the board from the console is worth one deliberate
   global — it is how the flat renderer was checked, and it is the only way
   to drive the sim by hand now. */
window.POT={T,at,use,tick,settle,rebuild,POWERS,scene,
  CLOUD,CLOUD_Z,LAYER,RAINFALL,
  CELL,TOP,cell,retop,ZN,Z0,AIR,ROCK,BASALT,instHex,ground,
  camera:()=>cam, hover:i=>hover(i),
  get power(){ return POWER.k },
  set power(k){ POWER=POWERS.find(p=>p.k===k)||POWER; drawMenu(); }};

/* the draw loop. Named frame(), not tick() — a tick is a step of the world
   now, and the two must never be confused. */
function frame(){ controls.update(); renderer.render(scene,cam);
  requestAnimationFrame(frame); }
drawMenu(); drawBrush(); drawRates(); setSun(0); settle(); rebuild(); resize(); drawInfo(); frame();
</script>
</body>
</html>
